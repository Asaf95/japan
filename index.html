<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יפן 2026: התוכנית הסופית</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#0f1115;--card:#171a21;--card2:#1d2129;--text:#e8e9ec;--muted:#9aa1ac;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f5b83d;--accent:#5aa9ff;--eve:#a78bfa;--border:#2a2f3a;--c:#5aa9ff;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;line-height:1.65;display:flex;flex-direction:column;overflow:hidden;}
  header{backgroundk:var(--card);border-bottom:1px solid var(--border);padding:10px 18px 0;flex-shrink:0;}
  header h1{margin:0;font-size:1.3rem;}
  header .facts{color:var(--muted);font-size:.82rem;margin:2px 0 8px;}
  .secs{display:flex;gap:4px;flex-wrap:wrap;}
  .secs button{background:transparent;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;padding:8px 14px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .secs button small{display:block;font-weight:400;font-size:.72rem;}
  .secs button.active{background:var(--bg);color:#fff;border-color:var(--border);box-shadow:inset 0 3px 0 var(--sc);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;min-height:48px;}
  .chips button{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.82rem;cursor:pointer;font-family:inherit;}
  .chips button.active{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc) inset;color:#fff;}
  .chips .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle;}
  .chips .qn{font-size:.68rem;background:rgba(90,169,255,.2);color:var(--accent);border-radius:10px;padding:0 6px;margin-inline-start:5px;}
  .layout{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:0;}
  .pane{overflow-y:auto;padding:20px 24px 80px;}
  .map-pane{border-inline-start:1px solid var(--border);position:relative;}
  #map{position:absolute;inset:0;}
  #mapbtn{position:fixed;bottom:16px;left:16px;z-index:1000;background:var(--accent);color:#0f1115;border:none;border-radius:24px;padding:10px 16px;font-weight:800;font-size:.9rem;font-family:inherit;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.5);}
  body.nomap .map-pane{display:none;} body.nomap .layout{grid-template-columns:1fr;}
  body.nomap .pane{max-width:1000px;width:100%;margin:0 auto;}
  body.maponly #mapbtn{display:none;} body.maponly .map-pane{display:block !important;height:100vh;}
  @media (max-width:900px){
    body{overflow:auto;display:block;}
    header{padding:8px 10px 0;} header h1{font-size:1.05rem;} header .facts{font-size:.72rem;margin:0 0 6px;}
    .secs,.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .secs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none;}
    .secs button{flex-shrink:0;padding:6px 10px;font-size:.85rem;}
    .chips{padding:8px 10px;min-height:0;position:sticky;top:0;z-index:6;}
    .chips button{flex-shrink:0;white-space:nowrap;}
    html,body{overflow-x:hidden;max-width:100vw;}
    .layout{display:flex;flex-direction:column;width:100%;}
    .pane{width:100%;min-width:0;overflow-wrap:break-word;}
    .meta span{white-space:normal;}
    .map-pane{height:42vh;position:sticky;top:44px;z-index:5;order:-1;border-inline-start:none;border-bottom:1px solid var(--border);}
    .pane{overflow:visible;padding:12px 10px 90px;}
    .dayhead,.card{padding:12px;} .dayhead .date{font-size:1.15rem;}
    .tl{padding:4px 10px;}
    .step{grid-template-columns:48px 24px 1fr;gap:6px;font-size:.88rem;}
    .step .t{font-size:.8rem;}
    table{display:block;overflow-x:auto;font-size:.78rem;} th,td{padding:5px 6px;min-width:64px;} td:first-child{min-width:90px;}
    .nav .navbtn{padding:8px 12px;}
  }
  h2{font-size:1.15rem;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--border);color:var(--accent);}
  h2:first-child{margin-top:0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin:10px 0;}
  .card.warn{border-right:5px solid var(--warn);} .card.add{border-right:5px solid var(--good);} .card.q{border-right:5px solid var(--accent);}
  .card ul{margin:6px 0 0;padding-inline-start:22px;} .card li{margin-bottom:6px;}
  .card h3{margin:0 0 6px;font-size:1rem;color:#fff;}
  table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.85rem;}
  th,td{border:1px solid var(--border);padding:6px 9px;text-align:right;vertical-align:top;}
  th{background:var(--card2);color:var(--accent);}
  tr.click{cursor:pointer;} tr.click:hover td{background:rgba(255,255,255,.03);}
  .tag{display:inline-block;font-size:.66rem;font-weight:800;padding:1px 8px;border-radius:20px;margin-inline-end:5px;vertical-align:middle;white-space:nowrap;}
  .tag.must{background:rgba(90,169,255,.15);color:var(--accent);} .tag.opt{background:rgba(154,161,172,.18);color:var(--muted);}
  .tag.new{background:rgba(62,207,142,.15);color:var(--good);} .tag.split{background:rgba(192,132,252,.15);color:#c084fc;}
  .tag.book{background:rgba(245,184,61,.15);color:var(--warn);} .tag.eve{background:rgba(167,139,250,.18);color:var(--eve);}
  .tag.alt{background:rgba(255,107,107,.12);color:#ff9b9b;}
  .tag.done{background:rgba(62,207,142,.16);color:var(--good);} .tag.todo{background:rgba(255,107,107,.22);color:#ff8f8f;}
  .step.todo{background:rgba(255,107,107,.08);border-radius:8px;box-shadow:inset -4px 0 0 #ff6b6b;padding-inline:6px;}
  .step .todo-note{display:block;color:#ff9b9b;font-size:.82rem;font-weight:700;margin-top:3px;}
  .chips .qn.todo{background:rgba(255,107,107,.22);color:#ff8f8f;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:6px 0 10px;}
  .dayhead{border-top:4px solid var(--c);background:var(--card);border-radius:14px;padding:14px 18px;margin-bottom:12px;}
  .dayhead .date{font-size:1.35rem;font-weight:800;color:#fff;}
  .dayhead .theme{color:var(--c);font-weight:700;margin-top:2px;}
  .dayhead .about{margin-top:8px;font-size:.93rem;}
  .status{white-space:nowrap;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:20px;margin-inline-start:8px;vertical-align:middle;background:rgba(154,161,172,.15);color:var(--muted);}
  .status.booked{background:rgba(62,207,142,.15);color:var(--good);} .status.open{background:rgba(245,184,61,.15);color:var(--warn);}
  .status.fri{background:rgba(255,107,157,.15);color:#ff8fb6;} .status.shabbat{background:rgba(167,139,250,.18);color:var(--eve);}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;}
  .meta span{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:3px 10px;} .meta b{color:#fff;}
  .tl{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 14px;}
  .step{display:grid;grid-template-columns:64px 26px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.92rem;align-items:start;}
  .step:last-child{border-bottom:none;}
  .step[data-i]{cursor:pointer;} .step[data-i]:hover{background:rgba(255,255,255,.03);}
  .step .t{font-weight:800;color:#fff;font-variant-numeric:tabular-nums;padding-top:1px;}
  .step .n{width:24px;height:24px;border-radius:50%;background:var(--c);color:#0f1115;font-weight:800;font-size:.74rem;display:flex;align-items:center;justify-content:center;}
  .step.opt .n{background:transparent;border:2px dashed var(--c);color:var(--text);}
  .step.move{color:var(--muted);font-size:.86rem;} .step.move .t{color:var(--muted);font-weight:600;}
  .step.move .n{background:transparent;color:var(--muted);}
  .step.alt{opacity:.85;} .step.alt .t{color:#ff9b9b;font-size:.8rem;}
  .step .d{color:var(--muted);font-size:.83rem;display:block;margin-top:2px;}
  .step .info{display:block;color:#c9ced8;font-size:.85rem;margin-top:3px;line-height:1.55;}
  .step .info b{color:#fff;}
  .step .tip{display:block;color:#f5d58a;font-size:.83rem;margin-top:3px;}
  .daybox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 18px;margin:10px 0;font-size:.92rem;}
  .daybox h4{margin:0 0 6px;font-size:.95rem;color:var(--c);}
  .daybox ul{margin:4px 0 0;padding-inline-start:20px;} .daybox li{margin-bottom:4px;}
  .eve-box{margin-top:12px;background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.3);border-radius:14px;padding:8px 14px;}
  .eve-box h4{margin:4px 0;color:var(--eve);font-size:.92rem;}
  .eve-box .n{background:#2b2150 !important;border:2px solid var(--eve) !important;color:#fff !important;}
  .note{margin-top:12px;font-size:.87rem;color:var(--muted);background:rgba(90,169,255,.06);border:1px solid rgba(90,169,255,.2);border-radius:10px;padding:8px 12px;} .note b{color:#fff;}
  .qbox{margin-top:12px;background:rgba(90,169,255,.08);border:1px solid rgba(90,169,255,.35);border-radius:14px;padding:10px 16px;}
  .qbox h4{margin:0 0 6px;color:var(--accent);}
  .qbox ol{margin:0;padding-inline-start:22px;} .qbox li{margin-bottom:8px;font-size:.9rem;}
  .qbox .why{color:var(--muted);font-size:.8rem;display:block;}
  .qbox .op{display:inline-block;font-size:.72rem;border:1px solid var(--border);border-radius:6px;padding:0 6px;margin:3px 0 0 4px;color:var(--muted);}
  .links{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
  .links a,.navbtn{font-size:.82rem;color:var(--accent);text-decoration:none;border:1px solid rgba(90,169,255,.35);border-radius:8px;padding:4px 10px;background:transparent;cursor:pointer;font-family:inherit;}
  .links a:hover,.navbtn:hover{background:rgba(90,169,255,.1);}
  .nav{display:flex;justify-content:space-between;margin-top:18px;}
  .num-icon{border-radius:50%;color:#0f1115;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #0f1115;box-shadow:0 1px 4px rgba(0,0,0,.6);width:24px;height:24px;}
  .num-icon.opt{background:#fff !important;border:2px dashed;color:#111;}
  .num-icon.eve{background:#2b2150 !important;border:2px solid #a78bfa;color:#fff;}
  .home-icon{font-size:22px;line-height:1;}
  .leaflet-popup-content{direction:rtl;text-align:right;font-family:"Segoe UI","Arial Hebrew",Arial,sans-serif;color:#111;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;} @media(max-width:700px){.grid2{grid-template-columns:1fr;}}
  .big{font-size:1.4rem;font-weight:800;color:#fff;}
  .task{padding:7px 10px;border:1px solid var(--border);border-radius:10px;margin:6px 0;background:var(--card);font-size:.9rem;}
  .task.urgent{border-right:5px solid var(--bad);} .task.opt{opacity:.8;} .task.done{opacity:.45;text-decoration:line-through;}
  .task label{cursor:pointer;} .task .when{font-weight:800;color:var(--warn);margin-inline-end:4px;}
  .task .dl{font-size:.75rem;color:var(--accent);cursor:pointer;margin-inline-start:6px;white-space:nowrap;}
  body.maponly header, body.maponly .chips, body.maponly .pane{display:none;}
  body.maponly .layout{grid-template-columns:1fr;} body.maponly .leaflet-control-layers{display:none;}
  footer{margin-top:30px;color:var(--muted);font-size:.78rem;text-align:center;}
</style>
</head>

ם. 200–500 ין לסיבוב. זו יפן המוזרה בגרסה הכי מרוכזת.", "info": "Gachapon Kaikan הוא בית מכונות קפסולות עם מאות מכונות. כל סיבוב עולה בערך 200 עד 500 ין, ויוצא צעצוע קטן ומוזר. לא יודעים מה יוצא, וזה חצי מהכיף. מקום מצוין למזכרות קטנות לחברים.", "tip": "להכין מראש הרבה מטבעות של 100 ין, כי המכונות לא מקבלות שטרות."}, {"t": "17:00", "name": "מקדש Kanda Myōjin", "type": "opt", "lat": 35.702, "lng": 139.7679, "d": "10 דק׳ הליכה, מואר בערב.", "info": "Kanda Myōjin נוסד בשנת 730 ומוקדש בין היתר לאלי העסקים והמזל. הוא ידוע כמקום שבו מברכים ציוד אלקטרוני חדש, ולכן יש בו קמעות בעיצוב טכנולוגי. המקדש מואר בערב. הוא קרוב לאקיהברה, בערך 10 דקות הליכה.", "tip": "מתאים לסוף היום, כשהאור יורד ואפשר לראות את התאורה."}, {"t": "17:45", "name": "🚆 קו Hibiya לגינזה (10 דק׳)", "move": true}, {"t": "18:00", "name": "<b>קאבוקי-זה<\/b>: מערכה בודדת", "type": "opt", "isNew": true, "lat": 35.6695, "lng": 139.7678, "d": "<b>מחליטים באותו יום.<\/b> כרטיס למערכה בודדת (Hitomaku-mi) קונים בקופה ביום עצמו. 60–90 דק׳, בערך 2,000 ין. משם 10 דק׳ הביתה.", "info": "Kabuki-za הוא התיאטרון הראשי של קאבוקי בגינזה. אפשר לקנות כרטיס למערכה בודדת (hitomaku-mi) ביום עצמו, ולקבל טעימה מהסגנון: תלבושות, איפור ושחקנים גברים שמגלמים גם נשים. יש אוזניות עם הסבר באנגלית. מערכה נמשכת בערך 60 עד 90 דקות."}, {"t": "או", "name": "🚆 הביתה ישר מאקיהברה (20 דק׳)", "move": true}], "note": "<b>הבוקר פתוח, בשתי גרסאות:<\/b> ישנים (א), או יוצאים ב-08:00 (ב). בשתיהן, בשעה 11:00 כבר באומוטסנדו. החובה מתחילה ב-11:45.", "sec": "tokyo", "base": {"name": "הדירה בטוקיו (Shiba)", "lat": 35.65147, "lng": 139.7511}, "ride": "🚆 כ-60 דק׳", "about": "קמים לאט אחרי ליל האלווין. רקדני הרוקבילי בהראג׳וקו (רק בראשון), ואז המדרחוב באקיהברה. הבנות נשארות לקניות. קאבוקי אם יש כוח.", "dec": "שתי גרסאות לבוקר: ישנים, או יוצאים ב-08:00. על הקאבוקי מחליטים שם.", "intro": "יום ראשון איטי אחרי ליל האלווין. הראג׳וקו עם רקדני הרוקבילי בפארק יויוגי, שמופיעים רק בימי ראשון, ואחר כך אקיהברה עם עולם האנימה והמשחקים. בערב אפשר לקפוץ לקאבוקי אם יש כוח.", "t 3ecf8e", "status": "booked", "walk": "כ-6 ק״מ", "stops": [{"t": "05:40", "name": "🚆 הליכה ל-Daimon (8 דק׳), ומשם קו Toei Asakusa ישיר לאסאקוסה (כ-18 דק׳). משם 3–5 דק׳ הליכה ל-Tobu Asakusa. או מונית ב-05:55", "move": true}, {"t": "06:30", "name": "🚆 <b>Revaty Kegon 1<\/b> (רכבת 1001) מ-Tobu Asakusa, מגיעה ל-Tobu-Nikko ב-08:25", "move": true, "book": true, "bk": "done"}, {"t": "08:30", "name": "🚌 אוטובוס בכביש Irohazaka לצ'וזנג'י (45 דק׳)", "move": true}, {"t": "09:15", "name": "מפלי קגון", "type": "must", "lat": 36.738, "lng": 139.5023, "info": "Kegon Falls הוא מפל בגובה כ-97 מטר, אחד משלושת המפלים המפורסמים ביפן. הוא זורם מאגם צ׳וזנג׳י במורד צוק סלעי. מעלית מוציאה לתצפית פנורמית על הנפילה. בסתיו הוא מוקף בצבעי שלכת.", "tip": "המעלית בתשלום קטן. התצפית החינמית למעלה טובה גם היא, אבל מהמעלית רואים את הנפילה כולה."}, {"t": "10:15", "name": "אגם צ'וזנג'י", "type": "must", "lat": 36.7356, "lng": 139.491, "info": "Lake Chūzenji הוא אגם הרים בגובה כ-1,270 מטר, שנוצר כשהתפרצות הר געש חסמה נהר. סביבו יער שהופך לאדום וצהוב בסתיו, ועל המים יש שקט כמעט מוחלט. בעבר היה אזור נופש של שגרירים זרים, וחלק מהבתים נשמרו.", "tip": "הכביש לאזור מתפתל וחוסם תנועה בשיא הסתיו. לתכנן זמן מרווח לחזרה."}, {"t": "11:15", "name": "🚌 אוטובוס חזרה למטה (45 דק׳)", "move": true}, {"t": "13:00", "name": "גשר שינקיו", "type": "must", "lat": 36.7536, "lng": 139.6036, "info": "Shinkyō Bridge הוא גשר עץ אדום וקדוש ליד הכניסה לאזור המקדשים של ניקו, בצורתו הנוכחית משנת 1636 בערך. הוא חלק מאתר המורשת העולמית של ניקו. הגשר שימש בעבר רק את השליחים של השוגון, והיום הוא נקודת צילום קלאסית לפני העלייה למקדשים. חוצים אותו בתשלום, ולכן בדרך כלל מצלמים מהצד.", "tip": "לצלם מהגשר הציבורי שלצדו, שהוא חינם. לא חייבים לעבור על הגשר עצמו."}, {"t": "13:15", "name": "Tōshō-gū", "type": "must", "lat": 36.758, "lng": 139.5988, "info": "Nikkō Tōshō-gū הוא המאוזוליאום של איאיאסו טוקוגאווה, מייסד שוגונט טוקוגאווה. הוא נבנה ב-1617 והורחב בימי נכדו. כל קיר מכוסה בגילוף ובזהב. משם מגיעים הקופים הידועים (ראה, שמע, דבר לא רע) והחתול הישן המפורסם. האתר גדול ויש בו הרבה מבנים, ולכן כדאי לתכנן.", "tip": "את החתול הישן מוצאים מעל הכניסה לשביל שמוביל לקברו של איאיאסו. אפשר לדלג על המדרגות העליונות אם אין זמן."}, {"t": "14:30", "name": "Futarasan", "type": "must", "lat": 36.7597, "lng": 139.5957, "info": "Futarasan Shrine הוא מקדש שינטו עתיק שמוקדש לאלי ההרים של ניקו, והוא חלק מאתר המורשת. האווירה שקטה, בתוך יער ירוק, ויש בו פחות פאר מבטושוגו. המקדש מקיף גם את אזור האגם והר Nantai, לפי המסורת.", "tip": "אחרי ההמון בטושוגו זה מקום לנשום. לשבת רגע ולהמשיך."}, {"t": "14:50", "name": "Taiyū-in", "type": "opt", "isNew": true, "lat": 36.7588, "lng": 139.5948, "d": "צמוד ל-Futarasan, עם הרבה פחות אנשים.", "info": "Taiyū-in הוא המאוזוליאום של איאמיצו, נכדו של איאיאסו. הוא קטן ואינטימי יותר מטושוגו, ובדרך כלל עמוס פחות. הכניסה עוברת בין שערים עם שומרים מגולפים, והמבנים משובצים בזהב ובצבעים עזים. נבנה במכוון בצניעות כדי לא לעלות על סבו.", "tip": "אם אין זמן לכל האתרים, זה אחד שכדאי לא לפספס."}, {"t": "15:20", "name": "Kanmangafuchi: פסלי הג'יזו", "type": "opt", "lat": 36.7483, "lng": 139.5895, "info": "Kanmangafuchi הוא שביל לאורך נהר Daiya עם שורה של פסלוני ג׳יזו מאבן. לפי הסיפור קשה לספור אותם אותו מספר פעמים, ולכן הם נקראים \"ג׳יזו שאי אפשר לספור\". זה מקום שקט לסיום היום, ואפשר להגיע אליו בהליכה מהמקדשים.", "tip": "לבדוק מראש שעוד אור, כי השביל בין עצים ומחשיך מוקדם."}, {"t": "17:22", "name": "🚆 <b>Revaty Kegon 46<\/b> (רכבת 1046) מ-Tobu-Nikko, באסאקוסה ב-19:15, ומשם קו Asakusa הביתה (20 דק׳)", "move": true, "book": true, "bk": "done"}], "sec": "tokyo", "base": {"name": "הדירה בטוקיו (Shiba)", "lat": 35.65147, "lng": 139.7511}, "ride": "🚆 <b>כ-5.5 שעות<\/b> (רכבות, אוטובוסים ומונית)", "about": "טיול יום לניקו ברכבת Tobu: מפלי קגון ואגם צ׳וזנג׳י בבוקר, Tōshō-gū והמקדשים אחר הצהריים. היציאה ב-05:40.", "dec": "הוזמן בהצלחה (אחרי שהניסיון הראשון ב-2/10 לא הצליח). ✅", "daytrip": true, "note": "היום עם הכי הרבה זמן ישיבה. זה בסדר, כי יש בו שני קטעי רכבת ארוכים שבהם אפשר לנוח. <b>🔁 למה ניקו בשני:<\/b> אם לא מצל ווירה. פחות עמוס ונעים לצילום. מפורסם גם בגן אזליאות באביב.", "tip": "מקום טוב לצילום קצר בדרך. לא מקדישים הרבה זמן."}, {"t": "13:00", "name": "שוק אמיוקו", "type": "must", "lat": 35.709, "lng": 139.77463, "info": "Ameyoko הוא שוק רחוב צפוף מתחת לפסי הרכבת, שנולד כשוק שחור אחרי המלחמה. מוכרים בו פירות מיובשים, תבלינים, נעלי ספורט ודגים. הרבה צעקות, קצב מהיר ומוכרים שמנסים למשוך לקוחות. פירות מיובשים ואגוזים אפשר לשקול, בכפוף לבדיקת כשרות.", "tip": "אפשר להתמקח קלות על חלק מהמוצרים. להחזיק את התיק לפנים בגלל הצפיפות."}, {"t": "13:40", "name": "🚆 קו Ginza מ-Ueno ל-Tawaramachi (5 דק׳)", "move": true}, {"t": "14:00", "name": "<b>סדנת אוכל פלסטיק מזויף<\/b>: Ganso Shokuhin Sample-ya", "type": "opt", "isNew": true, "lat": 35.7126, "lng": 139.788, "d": "מכינים טמפורה וחסה מפלסטיק, כמו בחלונות הראווה של המסעדות. כשעה. <b>צריך הזמנה מראש<\/b>, ולבדוק שיש סדנה ביום חמישי בשעה הזאת.", "info": "Ganso Shokuhin Sample-ya הוא מקום שבו מכינים דגמי אוכל מפלסטיק, כמו שרואים בחלונות המסעדות ביפן. מרכיבים טמפורה או חסה מצבע ושעווה. הסדנה נמשכת כשעה, וזו מזכרת מצחיקה וייחודית. צריך הזמנה מראש, ולבדוק שיש סדנה ביום ובשעה הזו.", "book": true, "bk": "todo", "todo": "אופציונלי. סדנה קטנה, צריך להזמין אם רוצים.", "tip": "הסדנה עובדת עם דגמים, לא עם אוכל אמיתי, כך שאין בעיה של כשרות."}, {"t": "15:15", "name": "קאפבאשי: ציוד מטבח <b>וסכינים<\/b>", "type": "must", "lat": 35.7138, "lng": 139.7884, "d": "חנויות הסכינים הטובות הן Kamata ו-Kama-Asa. רוב החנויות נסגרות ב-17:00.", "info": "Kappabashi הוא רחוב של כ-170 חנויות לציוד מטבח: סכינים, כלי חרס, דגמי אוכל ושף ענק על גג בניין. כאן קונים סכינים מקצועיים, והמוכרים לרוב עוזרים לבחור. החנויות הטובות לסכינים הן Kamata ו-Kama-Asa. רוב החנויות נסגרות ב-17:00.", "tip": "ללכת קודם לחנויות הסכינים, כי הן נסגרות ראשונות. מוכרים רגילים לתיירים ועוזרים לבחור."}, {"t": "16:45", "name": "🚆 קו Ginza מ-Tawaramachi ל-Toranomon (20 דק׳), ו-10 דק׳ הליכה", "move": true}, {"t": "17:30", "name": "<b>teamLab Borderless<\/b>", "type": "opt", "lat": 35.66207, "lng": 139.74327, "info": "teamLab Borderless הוא מוזיאון דיגיטלי גדול, שבו היצירות זזות בין חדרים וממלאות אותם באור ובתנועה. אין מסלול קבוע, ולכן כל ביקור שונה. כדאי להזמין כרטיס מראש ולבדוק שעות.", "book": true, "bk": "todo", "todo": "אופציונלי. נגמר מראש. לפעמים יש כרטיסים ליום עצמו בכניסה.", "tip": "נעליים נוחות. אין מסלול קבוע, אז לא מנסים לראות הכול."}, {"t": "20:30", "name": "🚶 הליכה הביתה (25 דק׳)", "move": true}], "note": "<b>צוקיג׳י ירד<\/b>, כי את הסכינים קונים בנאקמיסה ב-30/10. היום מתחיל ב-09:00. הסדנה ו-Borderless אופציונליים, אבל אם רוצים אותם צריך להזמין מראש (ראו משימות).", "sec": "tokyo", "base": {"name": "הדירה בטוקיו (Shiba)", "lat": 35.65147, "lng": 139.7511}, "ride": "🚆 כ-55 דק׳", "about": "טוקיו הישנה ואומנות: המוזיאון הלאומי באואנו, יאנקה, קאפבאשי. אופציונלי: סדנת אוכל מזויף ו-teamLab Borderless בערב.", "dec": "בלי צוקיג׳י. הסדנה ו-Borderless אופציונליים.", "intro": "טוקיו הישנה והאומנות: המוזיאון הלאומי באואנו, שכונת יאנקה, שוק אמיוקו ורחוב הסכינים בקאפבאשי. בערב אפשר teamLab Borderless או סדנת האוכל המזויף, אבל רק אם הוזמנו מראש.", "tips": ["רוב חנויות קאפבאשי נסגרות ב-17:00, ולכן מגיעים לשם לא יאוחר מ-15:15.", "הסדנה ו-Borderless דורשים הזמנה. לבדוק לפני.", "יום חמישי בבוקר: לבדוק שהמוזיאון הלאומי פתוח, כי בימים מסוימים יש סגירות.", "כשקונים סכינים, לבדוק את הכללים לגבי הובלה במזוודה. סכינים בתיק יד אסורים."]}, {"id": "d0611a", "date": "שישי 6/11 · רעיון 1", "theme": "🟢 יום פתוח: מחליטים שם. רעיון: קמאקורה בבוקר", "color": "#a3e635", "status": "open", "daytrip": true, "walk": "כ-6 ק״מ", "stops": [{"t": "07:15", "name": "🚶 הליכה ל-Shimbashi (20 דק׳)", "move": true}, {"t": "07:40", "name": "🚆 JR Yokosuka לקמאקורה (55 דק׳), ומשם Enoden ל-Hase (5 דק׳)", "move": true}, {"t": "08:50", "name": "הבודהה הגדול (Kōtoku-in)", "type": "opt", "lat": 35.3167, "lng": 139.5358, "info": "Kōtoku-in הוא מקדש שבו יושב בודהה גדול מברונזה בגובה כ-13 מטר, שנוצק במאה ה-13. פעם עמד בתוך אולם, אבל האולם נהרס בסערות וצונאמי בימי הביניים, ומאז הפסל יושב בחוץ. אפשר להיכנס לתוכו בתשלום סמלי. האור והסביבה הירוקה הופכים אותו לצילום קלאסי.", "tip": "הכניסה לתוך הפסל זולה מאוד. כדאי לנצל את ההזדמנות."}, {"t": "09:30", "name": "Hase-dera: תצפית על המפרץ", "type": "opt", "lat": 35.3126, "lng": 139.5335, "info": "Hase-dera הוא מקדש בודהיסטי עתיק, מהמאה השמינית לפי המסורת. בו פסל קנון מעץ בגובה כ-9 מטר עם אחד עשר ראשים. הגן בנוי בטרסות ומעניק נוף יפה של המפרץ. יש גם מערה קטנה עם פסלים.", "tip": "התצפית אל המפרץ היא העיקר. לבדוק שעות סגירה, כי בסתיו נסגר מוקדם."}, {"t": "10:30", "name": "🚆 Enoden חזרה לקמאקורה (5 דק׳)", "move": true}, {"t": "10:45", "name": "Komachi-dori", "type": "opt", "lat": 35.3202, "lng": 139.5512, "info": "Komachi-dori הוא רחוב הולכי רגל צפוף וציורי בקמאקורה, עם חנויות מזכרות, חטיפים וחנויות קטנות. הוא מוביל לכיוון המקדש הראשי. נעים לטייל בו בקצב איטי. חטיפים כאן דורשים בדיקת כשרות.", "tip": "הרחוב צפוף בסופי שבוע. ביום שישי מוקדם הוא שקט יותר."}, {"t": "11:15", "name": "Tsurugaoka Hachimangū", "type": "opt", "lat": 35.3259, "lng": 139.5565, "info": "Tsurugaoka Hachimangū הוא המקדש המרכזי של קמאקורה, שנוסד ב-1063 והועבר למקומו הנוכחי ב-1180 בידי Minamoto no Yoritomo, מייסד שוגונט קמאקורה. שדרה ארוכה עם שערי טורי מובילה אליו, ובסופה מדרגות. הכניסה לשטח עצמה חינם. זה לב ההיסטוריה של העיר.", "tip": "לעלות במדרגות לאולם הראשי ולהסתובב לראות את השדרה מלמעלה."}, {"t": "12:00", "name": "Hōkoku-ji: יער הבמבוק", "type": "opt", "isNew": true, "lat": 35.3196, "lng": 139.5647, "info": "Hōkoku-ji, מקדש הבמבוק, כולל יער של כ-2,000 גבעולי במבוק ירוקים. אפשר לשבת בגן ולשתות מאצ׳ה בין העצים, בתשלום. האווירה שקטה ורגועה, ופחות עמוסה מאראשייאמה. כאן מרגישים את הרוגע של קמאקורה.", "tip": "תה מאצ׳ה: לבדוק כשרות של המתוק שמוגש איתו. התה עצמו הוא רק עלי תה, אבל זה לפי החלטה."}, {"t": "13:15", "name": "🚆 JR חזרה ל-Shimbashi (55 דק׳), בבית בסביבות 14:30", "move": true}, {"t": "16:25", "name": "כניסת שבת", "move": true}], "note": "<b>יום פתוח בכוונה.<\/b> לא מזמינים כלום מראש, ומחליטים בטוקיו לפי מה שעוד לא הספקתם. אלה רק שני רעיונות, ואפשר גם משהו אחר לגמרי. חוזרים הביתה עד בערך 14:30.", "sec": "tokyo", "base": {"name": "הדירה בטוקיו (Shiba)", "lat": 35.65147, "lng": 139.7511}, "ride": "🚆 כ-2 שעות", "about": "יום פתוח, בכוונה. מחליטים בטוקיו. הרעיון הראשון: קמאקורה בבוקר, ובבית עד 14:30.", "dec": "", "intro": "יום פתוח בכוונה, בלי הזמנות מראש. הרעיון הראשון: קמאקורה, עיר שהייתה בירת השוגונים במאות ה-12 עד ה-14. הודגשו בה בודהה הגדול, מקדשים על הגבעות ויער במבוק קטן. חוזרים הביתה עד כ-14:30.", "tips": ["קמאקורה ברכבת מהירה מטוקיו, בערך שעה. לבדוק את הקו מראש.", "מדרגות ומדרונות במקדשים. נעליים נוחות.", "בסופי שבוע עמוס. ביום שישי בבוקר שקט יותר.", "לבדוק שעות פתיחה ותשלומי כניסה לפני שיוצאים."]}, {"id": "d0611b", "date": "שישי 6/11 · רעיון 2", "theme": "🟢 יום פתוח: מחליטים שם. רעיון: ריוגוקו, זכוכית וגינזה", "color": "#94a3b8", "status": "open", "walk": "כ-4 ק״מ", "stops": [{"t": "08:40", "name": "🚆 מ-Daimon, קו Ōedo ישיר לריוגוקו (20 דק׳)", "move": true}, {"t": "09:00", "name": "מוזיאון הסומו בריוגוקו", "type": "opt", "lat": 35.6969, "lng": 139.7934, "info": "מוזיאון הסומו נמצא בתוך אצטדיון Kokugikan בריוגוקו. הוא קטן, מציג גלימות, תמונות והיסטוריה של הספורט, ובדרך כלל חינם. סומו הוא ספורט עתיק עם טקסים שינטואיסטיים. אם מתקיים טורניר פעיל המוזיאון סגור, ולכן לבדוק.", "tip": "בדרך כלל שווה 30 עד 40 דקות. אם יש אימון פתוח, זה יתרון, אבל אין להסתמך על זה."}, {"t": "09:45", "name": "מוזיאון Hokusai", "type": "opt", "isNew": true, "lat": 35.6967, "lng": 139.7982, "info": "Sumida Hokusai Museum מוקדש לאמן Katsushika Hokusai, יוצר \"הגל הגדול\". הוא נולד באזור הזה, והבניין המודרני נבנה ב-2016 ליד אתר לידתו. התערוכה הקבועה מציגה את חייו, את שיטות העבודה שלו וחלק מיצירותיו. קטן וממוקד.", "tip": "הדפסי העץ המקוריים מתחלפים, ולכן לבדוק מה מוצג."}, {"t": "10:45", "name": "<b>סדנת Edo Kiriko<\/b>: חריטה בזכוכית, בסומידה", "type": "opt", "isNew": true, "lat": 35.697, "lng": 139.814, "d": "מלאכה מסורתית של טוקיו. חורטים דוגמה על כוס ולוקחים אותה הביתה. כ-90 דק׳, בערך 4,000–6,000 ין. צריך להזמין מראש. תחנה אחת מריוגוקו (Kinshichō). <b>זה יום שישי<\/b>, אז רק אם מבשלים לשבת כבר ביום חמישי בלילה.", "info": "Edo Kiriko היא אמנות חריטה בזכוכית שהתחילה בטוקיו ב-1834. חורטים דוגמאות גאומטריות עדינות על כוס, ולוקחים אותה הביתה כמזכרת אישית. הסדנה נמשכת כ-90 דקות, בערך 4,000 עד 6,000 ין, וצריך להזמין מראש. אפשר להגיע אליה בתחנה אחת מריוגוקו (Kinshichō). זה יום שישי, ולכן רק אם הבישול לשבת כבר מוכן ביום חמישי בלילה.", "tip": "הכוס שנחרטת נארזת בדרך הביתה, לא בתיק יד. מבקשים אריזה מתאימה מראש."}, {"t": "10:45", "name": "<b>או פיצול:<\/b> הבנות יוצאות ישר לגינזה, והבנים בסדנה", "type": "opt", "split": true, "lat": 35.6717, "lng": 139.765, "d": "הבנים מצטרפים בסביבות 12:45 (20 דק׳ ברכבת).", "info": "אפשרות לפצל: הבנות יוצאות ישר לגינזה לקניות, והבנים בסדנה. הבנים מצטרפים בסביבות 12:45 אחרי כ-20 דקות ברכבת.", "tip": "לתאם נקודת מפגש מדויקת בגינזה מראש."}, {"t": "12:30", "name": "🚆 מ-Kinshichō, JR ל-Shimbashi, והליכה לגינזה (20 דק׳)", "move": true}, {"t": "12:45", "name": "גינזה: Itoya, Ginza Six, Uniqlo", "type": "opt", "lat": 35.6725, "lng": 139.764, "info": "גינזה היא אזור קניות יוקרתי. Itoya היא חנות ניירות ב-12 קומות עם מכתבים, עטים וצעצועים. Ginza Six הוא קניון מעוצב, ו-Uniqlo היא החנות הדגל הגדולה של המותג. טוב לקניות רגועות. ביום שישי אחר הצהריים הולכים הביתה בזמן.", "tip": "Itoya שווה לפחות רבע שעה, גם למי שלא אוהב ניירות."}, {"t": "14:30", "name": "🚆 קו Asakusa מ-Higashi-Ginza ל-Daimon (6 דק׳)", "move": true}], "sec": "tokyo", "base": {"name": "הדירה בטוקיו (Shiba)", "lat": 35.65147, "lng": 139.7511}, "ride": "🚆 כ-45 דק׳", "about": "יום פתוח, בכוונה. הרעיון השני: ריוגוקו וסדנת זכוכית, או פיצול לגינזה.", "dec": "", "intro": "הרעיון השני ליום הפתוח: ריוגוקו עם סומו והוקוסאי, אולי סדנת חריטת זכוכית מסורתית, ואחר כך גינזה לקניות רגועות. הכול בעיר, בלי נסיעות ארוכות.", "tips": ["סדנת הזכוכית דורשת הזמנה מראש. אם לא הוזמנה, מדלגים.", "זה יום שישי. הולכים הביתה בזמן ומכינים לשבת.", "אם יש טורניר סומו, המוזיאון סגור. לבדוק בלוח.", "גינזה: בדרך כלל החנויות נפתחות סביב 11:00."]}, {"id": "d0711", "date": "שבת 7/11", "theme": "Atago ← היביה ← הארמון ← Oedo Market ← גינזה", "color": "#fb7185", "status": "open", "walk": "<b>כ-10 ק״מ<\/b>", "stops": [{"t": "09:15", "name": "Atago Jinja: 86 מדרגות", "type": "must", "lat": 35.6645, "lng": 139.7485, "d": "1.6 ק״מ מהדירה.", "info": "Atago Jinja עומד על גבעה, ומעליו עולות 86 מדרגות תלולות. הגבעה היא אחת הגבוהות בטוקיו המרכזית. נקראות \"מדרגות ההצלחה\", כי ב-1634 רכב סמוראי בשם Magaki Heikurō על סוס במעלה המדרגות כדי להביא פרח שזיף לשוגון. בראש המדרגות מקדש שקט.", "tip": "אפשר לעלות לאט. יש גם דרך עוקפת מתונה יותר לצד, ואם מעדיפים משתמשים בה."}, {"t": "10:15", "name": "פארק היביה", "type": "must", "lat": 35.6737, "lng": 139.756, "info": "Hibiya Park הוא הפארק המערבי הראשון ביפן, שנפתח ב-1903. יש בו אגם, גינות ועצים ישנים, ממש ליד משרדי גורדי השחקים. נעים להאט בו בדרך לארמון. בשבת הוא שקט יחסית.", "tip": "מקום טוב לעצור, לשבת על ספסל ולנוח לפני הקטע הארוך."}, {"t": "10:45", "name": "גשר ניג'ובאשי", "type": "must", "lat": 35.68023, "lng": 139.75359, "info": "Nijūbashi, שני גשרים אחד אחרי השני, נמצא בכניסה לארמון הקיסר. זו התמונה הקלאסית של הארמון: גשרי אבן וברזל, חפיר, חומת אבן ועצי אורן. הארמון עצמו סגור לציבור רוב השנה, אבל את הגשר רואים מהכיכר.", "tip": "הצילום הכי טוב מהצד של כיכר הארמון, עם הגשר והחומה ברקע."}, {"t": "11:15", "name": "ארמון הקיסר: הגנים המזרחיים", "type": "opt", "lat": 35.6856, "lng": 139.758, "d": "בלי התחייבות. זה רחוק מהדירה (כ-3.5 ק״מ). בשער נותנים אסימון פלסטיק שמחזירים ביציאה.", "info": "הגנים המזרחיים של הארמון הם השטח של טירת Edo הישנה, שהייתה מושב השוגונים לפני שהפכה לארמון. נשארו חומות אבן ענקיות, יסודות של מגדלים, גנים ושטחי דשא. הכניסה חינם, ומקבלים אסימון בשער שמחזירים ביציאה. המרחק מהדירה כ-3.5 ק״מ.", "tip": "זה אופציונלי. מי שעייף, מוותר ועובר ישר לתחנת טוקיו."}, {"t": "12:30", "name": "תחנת טוקיו: חזית הלבנים האדומות", "type": "must", "lat": 35.6812, "lng": 139.7671, "info": "חזית הלבנים האדומה של תחנת טוקיו נבנתה ב-1914 בידי האדריכל Tatsuno Kingo. הבניין נפגע בהפצצות ושוחזר ב-2012 לצורתו המקורית. הוא מרשים במיוחד בערב, כשהוא מואר. התחנה פעילה עד היום, וזו הדרך הכי יפה להיכנס ל\"טוקיו\".", "tip": "לצלם מכיכר Marunouchi שמול התחנה, ממרחק."}, {"t": "12:50", "name": "גג KITTE", "type": "opt", "lat": 35.67953, "lng": 139.76544, "d": "חינם, עולים ברגל או בדרגנוע. תצפית על התחנה.", "info": "KITTE הוא בניין הדואר המרכזי הישן, ששופץ למרכז קניות. על הגג יש גן ציבורי חינם. עולים ברגל או בדרגנוע, והנוף נשקף ישירות אל חזית תחנת טוקיו. מקום טוב לצילום בלי מאמץ.", "tip": "הגג פתוח ללא תשלום. אם סגור, מדלגים."}, {"t": "13:15", "name": "<b>Oedo Antique Market<\/b>, Tokyo International Forum", "type": "must", "lat": 35.6765, "lng": 139.7639, "d": "בשבת רק מסתכלים. השוק פתוח עד בסביבות 16:00.", "info": "Oedo Antique Market מתקיים בכניסה של Tokyo International Forum, מבנה זכוכית מודרני. זה שוק עתיקות, שמוכרים בו קרמיקה, קימונו, דפוסים וחפצים ישנים. בדרך כלל הוא מתקיים בראשון הראשון והשלישי בחודש, ולכן יש לבדוק אם הוא מתקיים בשבת 7/11. בשבת רק מסתכלים, בלי לקנות.", "tip": "לבדוק את לוח השוק באתר לפני. אם הוא לא מתקיים, ממשיכים לגינזה."}, {"t": "14:30", "name": "גינזה: המדרחוב", "type": "opt", "lat": 35.6717, "lng": 139.765, "info": "בסופי שבוע, השדרה הראשית של גינזה, Chūō-dōri, נסגרת לרכבים ונפתחת להולכי רגל. מטיילים באמצע הכביש בין חנויות היוקרה. זה סיום נעים ליום הליכה ארוך. בשבת רק מסתכלים על חלונות הראווה.", "tip": "לבדוק שעת סגירת הרחוב להולכי רגל. בדרך כלל הוא נפתח אחר הצהריים."}, {"t": "15:30", "name": "🚶 הליכה הביתה (כ-3 ק״מ). צאת שבת בסביבות 17:20.", "move": true}], "note": "יום ההליכה הכי ארוך, בכוונה. הכול בחוץ ובחינם, ואין שום דבר לנעול.", "sec": "tokyo", "base": {"name": "הדירה בטוקיו (Shiba)", "lat": 35.65147, "lng": 139.7511}, "ride": "🚆 אין (שבת)", "about": "שבת של הליכה, כ-10 ק״מ, הכל בחוץ ובחינם: Atago, היביה, ניג׳ובאשי, הגנים של ארמון הקיסר, תחנת טוקיו ושוק העתיקות Oedo.", "dec": "הגנים של ארמון הקיסר אופציונליים.", "intro": "שבת של הליכה, בערך 10 ק״מ, הכול בחוץ ובחינם. מתחילים בגבעת Atago, עוברים בפארק היביה, בגשר ניג׳ובאשי ובארמון הקיסר, ומסיימים בתחנת טוקיו ובגינזה. זו שבת ארוכה בכוונה, והקצב איטי.", "tips": ["שבת: הכול ברגל ובלי תשלום. לא נוגעים בכסף או בכרטיסים.", "המרחק הכולל כ-10 ק״מ. נעליים נוחות, מים, ושכבות.", "הגנים המזרחיים של הארמון: אסימון בכניסה שמחזירים ביציאה, ללא תשלום. לבדוק ימי סגירה.", "השקיעה בסביבות 16:40, והשבת מסתיימת קצת אחריה. מתכננים לחזור לפני החושך."]}, {"id": "d0811", "region": "האלפים", "date": "ראשון 8/11", "theme": "האקונה ברכב עד 15:00 ← קניות בגוטמבה ← Kofu בלילה (הבחירה שלכם: B)", "color": "#ff8a5b", "status": "booked", "ride": "🚆 35 דק׳ + 🚗 כ-3 שעות", "walk": "כ-5 ק״מ", "stops": [{"t": "07:00", "name": "🚆 Hamamatsuchō ← Shinagawa, ומשם שינקנסן Kodama לאודווארה. 4 מושבים עם מקום למזוודה גדולה, כולם באותו קרון", "move": true, "book": true, "bk": "todo", "todo": "אפשר ביפן, לא צפוי להיגמר. קודם מודדים את המזוודות."}, {"t": "08:30", "name": "איסוף הרכב בתחנת Odawara", "type": "must", "book": true, "lat": 35.2564, "lng": 139.155, "d": "אושר: 08:30. שני הנהגים צריכים להיות בדלפק.", "bk": "done", "info": "הרכב נאסף בתחנת Odawara, שם מגיעים בשינקנסן מטוקיו. זו נקודת המוצא ליום ולשבוע ההרים.", "tip": "שני הנהגים צריכים להיות בדלפק עם הרישיון והמסמכים. לבדוק שיש ETC ומפות בטלפון לפני שיוצאים."}, {"t": "08:45", "name": "🚗 עולים ב-Hakone Turnpike (כביש אגרה) ולא דרך Yumoto, שבסופי שבוע נתקע בפקקים", "move": true}, {"t": "09:00", "name": "תצפית Daikanzan בראש ה-Turnpike", "type": "opt", "isNew": true, "lat": 35.221, "lng": 139.085, "d": "בבוקר בהיר רואים את פוג׳י מעל אגם אשי. 10 דק׳, על הדרך.", "info": "תצפית על כביש ה-Turnpike שמשקיפה על מפרץ Sagami ועל הר פוג׳י ביום בהיר. זו עצירה קצרה בדרך ל-Hakone. הכביש עצמו נוסע בגובה והנוף נפתח בכמה נקודות. אין צורך לתכנן יותר מכמה דקות.", "tip": "אם פוג׳י מכוסה בעננים, לא עוצרים. בבוקר בהיר הנוף הכי טוב."}, {"t": "או", "name": "Hatajuku: סדנת Yosegi-zaiku (פסיפס עץ)", "type": "opt", "isNew": true, "lat": 35.2178, "lng": 139.0628, "d": "במקום ה-Turnpike: עולים בדרך הישנה ועוצרים כאן. הסדנה לוקחת 30–60 דק׳, ואז מגיעים לשער אחרי 10:00 ויש תור לצילום.", "info": "Hatajuku הוא כפר ישן בדרך Old Tōkaidō, והמקום שבו התפתחה אמנות ה-yosegi-zaiku של Hakone. מדביקים פיסות עץ בצבעים טבעיים לדוגמאות גאומטריות, ומכינים קופסה או תחתית קטנה. העץ לא נצבע, והצבעים באים מסוגי עץ שונים. זו מזכרת שנעשית ביד.", "tip": "לבדוק מראש איפה הסדנה פתוחה ואם צריך הזמנה."}, {"t": "09:20", "name": "Hakone Jinja: שער הטורי בתוך האגם", "type": "must", "lat": 35.2048, "lng": 139.0254, "d": "מגיעים לפני 10:00. ביום ראשון התור לצילום מגיע לשעה.", "info": "Hakone Jinja הוא מקדש משנת 757 על חוף אגם Ashi. שער הטורי האדום שעומד בתוך המים הוא התמונה המפורסמת של האזור. מדרגות האבן מובילות בין אורנים וארזים עתיקים אל המקדש עצמו. המקום נחשב אתר ישן של תפילה למען מסע בטוח.", "tip": "להגיע לפני 10:00. אחר כך התור לצילום ליד השער יכול להגיע לשעה."}, {"t": "10:15", "name": "ספינת הפיראטים Moto-Hakone ← Tōgendai (כ-40 דק׳)", "type": "opt", "split": true, "lat": 35.203, "lng": 139.024, "d": "שלושה שטים ונהג אחד מביא את הרכב ל-Tōgendai (25 דק׳), ונפגשים שם. אם לא רוצים להיפרד, נוסעים כולם ברכב.", "info": "ספינות תיירים בסגנון ספינות פיראטים חוצות את אגם Ashi. השיט נמשך כ-40 דקות ופוג׳י נראה מעל המים ביום בהיר. זו הפסקה נעימה מהנהיגה. נהג אחד צריך להביא את הרכב ל-Tōgendai ולפגוש שם את השאר."}, {"t": "11:00", "name": "חונים ב-Tōgendai ועולים ברכבל ל-Ōwakudani (כ-25 דק׳)", "type": "must", "lat": 35.237, "lng": 139.001, "d": "<b>הטריק של היום:<\/b> כך לא עומדים בתור לחניה ב-Ōwakudani, שביום ראשון בסתיו יכול להגיע לשעה. החניה ב-Tōgendai גדולה.", "info": "החניה ב-Tōgendai גדולה. משם עולים ברכבל ל-Ōwakudani, כך שלא צריך להתמודד עם החניה העמוסה בעמק. הרכבל עובר מעל עמק געשי פעיל ועולה כ-25 דקות. כשיש רוח או גזים, הוא נסגר.", "tip": "לבדוק ביום עצמו שהרכבל פועל, ואם לא, לדלג ל-Sengokuhara."}, {"t": "11:30", "name": "Ōwakudani: עמק הגופרית והביצים השחורות", "type": "must", "lat": 35.244, "lng": 139.0197, "d": "אדים וריח גופרית. ביום בהיר רואים את פוג׳י. ברכבל חוזרים ל-Tōgendai.", "info": "Ōwakudani הוא עמק געשי שנוצר בהתפרצות של Hakone לפני כ-3,000 שנה. מהקרקע עולים אדים לבנים וריח גופרית חזק. מבשלים כאן ביצים במי המעיין החם והן נהיות שחורות מהמינרלים. לפי המסורת, כל ביצה מוסיפה שבע שנות חיים. ביום בהיר פוג׳י נראה מכאן.", "tip": "הביצים השחורות: לא חייבים לאכול (לבדוק כשרות). למעלה קר יותר, מביאים שכבה חמה."}, {"t": "13:00", "name": "שדה עשב הסוסוקי של Sengokuhara", "type": "opt", "isNew": true, "lat": 35.258, "lng": 139.014, "d": "גבעה של עשב זהוב שמתנועע ברוח. בתחילת נובמבר הוא בשיא. חינם, 10 דק׳ מ-Tōgendai.", "info": "שדה עשב susuki ב-Sengokuhara הוא גבעה רחבה של עשב כסוף-זהוב שמתנודד ברוח בסתיו. תחילת נובמבר היא עונת השיא שלו, והאור הנמוך של אחר הצהריים מאיר אותו. הכניסה חופשית ויש שבילי הליכה קצרים.", "tip": "להגיע לפני השקיעה, כשהשמש נמוכה והעשב נראה זוהר."}, {"t": "או", "name": "Hakone Open-Air Museum: פסלים ענקיים בגן", "type": "opt", "lat": 35.2445, "lng": 139.052, "d": "אמנות בחוץ, ויש גם אמבט רגליים חם. לוקח כשעה וחצי, ואז הקניות מתקצרות.", "info": "Hakone Open-Air Museum נפתח ב-1969 וזה היה המוזיאון הראשון ביפן לפסלים בחוץ. יש בו עבודות של הנרי מור ושל פיקאסו ופסלים מודרניים בין ההרים. יש גם מגדל זכוכית צבעוני שאפשר לטפס בתוכו, ואמבט רגליים חם בגן. הביקור לוקח בערך שעה וחצי.", "tip": "מחירי כניסה ושעות לבדוק לפני. אם בוחרים בזה, הזמן בגוטמבה מתקצר."}, {"t": "14:45", "name": "🚗 לגוטמבה דרך מנהרת Otome (כ-30 דק׳)", "move": true}, {"t": "15:15", "name": "Gotemba Premium Outlets", "type": "must", "split": true, "lat": 35.3083, "lng": 138.9665, "d": "עד 19:45, כלומר כ-4.5 שעות. נסגר ב-20:00 (לבדוק). ביציאה בערב נוסעים מערבה, ולא לכיוון טוקיו שם הפקק.", "info": "Gotemba Premium Outlets הוא אחד האאוטלטים הגדולים ביפן, עם מאות חנויות ונוף להר פוג׳י מהחניון. זו הזדמנות אחרונה לקניות גדולות בצד הזה של הטיול. עם הרכב קל לטעון קניות."}, {"t": "או", "name": "Chūreitō: הפגודה עם פוג׳י", "type": "opt", "isNew": true, "lat": 35.5011, "lng": 138.8016, "d": "<b>נסיעה בלילה זה בכלל לא בעיה, אתם צודקים.<\/b> הבעיה היחידה: הפגודה שווה רק באור יום, כי בחושך לא רואים את פוג׳י מאחוריה. השקיעה ב-16:40, בזמן הקניות. אז הפגודה נשארת כאן כאופציה, למקרה שתעדיפו אותה.", "info": "Chūreitō היא פגודה אדומה בת חמש קומות על מורד ההר, ופוג׳י נראה מאחוריה. אחת התמונות המפורסמות של יפן. עולים כ-400 מדרגות עד לתצפית.", "tip": "שווה רק באור יום. בחושך פוג׳י לא נראה, ולכן זו אופציה במקום חלק מהקניות."}, {"t": "19:45", "name": "🚗 לקאוואגוצ׳י (45 דק׳), ומשם דרך מעבר Misaka ל-Kofu (כ-50 דק׳). מגיעים ב-21:30–22:00", "move": true}], "eve": {"t": "20:30", "opts": [{"name": "Momiji Kairo: מסדרון המייפלים המואר בקאוואגוצ׳י", "isNew": true, "lat": 35.523, "lng": 138.7414, "d": "ממש על הדרך ל-Kofu. מואר עד 22:00, אז ב-20:30 יש עוד זמן ויש חניה. לבדוק תאריכים.", "info": "Momiji Kairo הוא מסדרון עצי מייפל לאורך אגם Kawaguchi. בערב הוא מואר, והעלים האדומים מצטלמים יפה גם על המים. הוא על הדרך ל-Kofu, ובדרך כלל פעיל מאמצע אוקטובר עד אמצע נובמבר.", "tip": "לבדוק תאריכי תאורה לפני. מואר עד 22:00 לפי התוכנית."}, {"name": "Fuefukigawa Fruit Park: תצפית לילה על Kofu", "isNew": true, "lat": 35.694, "lng": 138.688, "d": "חינם, 15 דק׳ מהמלון. מתאים גם ב-22:00.", "info": "Fuefukigawa Fruit Park הוא פארק על גבעה מעל Kofu, ובעמק של Yamanashi שידוע בפירות שלו. התצפית נותנת נוף של אורות העמק בלילה. מקום שקט לסיום יום ארוך.", "tip": "אם פרי טרי נמכר בדרך, אפשר לקנות אחד (לבדוק כשרות). הדרך לפארק עולה בכביש צר, לנסוע בזהירות."}]}, "note": "<b>🚦 למה זה עובד ביום ראשון:<\/b> עולים לאגם ב-Turnpike ולא בכביש 1. ל-Ōwakudani מגיעים ברכבל מ-Tōgendai, כדי לא לעמוד בתור לחניה. מהאאוטלט יוצאים ב-19:45, והאורות של Momiji Kairo בדרך ל-Kofu. נסיעה בלילה זה לא בעיה. ברכב יהיו 4 מזוודות גדולות, אז לא משאירים אותן גלויות בחניות. <b>🧳 לפני שמזמינים מושבים עם מקום למזוודה:<\/b> מודדים אורך + רוחב + עומק. אם הסכום עד 160 ס״מ, לא צריך הזמנה מיוחדת. אם שולחים מזוודה אחת או שתיים ישר לקיוטו, מספיק כרטיס רגיל (ראו משימות).", "sec": "alps", "base": {"name": "Comfort Inn Kofu Isawa", "lat": 35.649, "lng": 138.64}, "about": "יוצאים מטוקיו עם כל הציוד. שינקנסן לאודווארה ורכב, יום של האקונה, קניות בגוטמבה עד 19:45, ונסיעה בלילה ל-Kofu.", "dec": "אאוטלט עד הסוף. הפגודה נשארת אופציה.", "intro": "יוצאים מטוקיו לאזור האקונה, אזור געשי סביב אגם Ashi עם נוף לפוג׳י. בבוקר יש שער טורי במים, ספינה ורכבל מעל עמק גופרית. אחר הצהריים קונים בגוטמבה, ובערב נוסעים בחושך ל-Kofu.", "tips": ["ברכב ארבע מזוודות גדולות: לא משאירים אותן גלויות בחניות, ומכסים אותן.", "ביום בהיר פוג׳י נראה בעיקר בבוקר. אם יש עננים, מוותרים על תצפיות ומתקדמים.", "ה-Ōwakudani תלוי ברוח ובגזים. לבדוק באתר הרכבל שהוא פועל לפני שיוצאים.", "שקיעה ב-16:40. הנסיעה ל-Kofu בלילה, לכן כדאי לתדלק בגוטמבה לפני היציאה.", "אוכל באאוטלט: אין להסתמך עליו. לקחת אוכל כשר מהבית או חטיפים ארוזים (לבדוק כשרות)."]}, {"id": "d0911", "region": "האלפים", "date": "שני 9/11", "theme": "Kofu ← מאטסומוטו ← קמיקוצ׳י ← שינהוטאקה ← טאקאיאמה", "color": "#7bd88f", "status": "open", "ride": "🚗 כ-4:30 שעות + 🚌 שעה", "walk": "כ-7 ק״מ", "stops": [{"t": "07:00", "name": "🚗 צפונה למאטסומוטו (כשעה וחצי)", "move": true}, {"t": "08:30", "name": "טירת מאטסומוטו: הטירה השחורה (צילום מבחוץ)", "type": "must", "lat": 36.2386, "lng": 137.9689, "d": "רק מבחוץ, עם ההשתקפות בתעלה. הכניסה פנימה אופציונלית (כ-45 דק׳).", "info": "הטירה השחורה של Matsumoto נבנתה בסוף המאה ה-16 והיא אחת מ-12 הטירות ביפן שעדיין עומדות עם המגדל המקורי. העץ השחור שלה בולט על רקע ההרים, ונראה יפה עם השתקפות בתעלה. אפשר להיכנס פנימה, אבל התוכנית היא לצלם מבחוץ.", "tip": "הצד עם הגשר האדום והתעלה הוא נקודת הצילום הטובה. 20–30 דקות מספיקות. הכניסה פנימה כ-45 דק׳, ויש מדרגות תלולות."}, {"t": "09:00", "name": "🚗 לחניון Sawando (שעה), ומשם 🚌 אוטובוס או מונית לקמיקוצ׳י (30 דק׳). אין כניסה לרכב פרטי", "move": true}, {"t": "10:30", "name": "Taishō-ike: הבריכה עם העצים המתים", "type": "must", "lat": 36.227, "lng": 137.6136, "info": "Taishō-ike נוצרה ב-1915 כשהתפרצות הר געש Yakedake חסמה את נהר Azusa. העצים שהיו שם נשארו עומדים מתים בתוך המים. הרי Hotaka ברקע, ובבוקר שקט יש השתקפויות. זו עצירה ראשונה בעמק.", "tip": "הבוקר הוא הזמן להשתקפות. ללכת ל-10 דק׳ לאורך הבריכה."}, {"t": "10:45", "name": "הליכה לאורך נהר Azusa, דרך Tashiro-ike", "type": "must", "lat": 36.237, "lng": 137.624, "d": "כ-3.5 ק״מ, שטוח, על שבילי עץ. זה הקטע הכי יפה.", "info": "Kamikochi הוא עמק אלפיני מוגן בתוך הפארק הלאומי של האלפים הצפוניים, ואין בו תנועת רכב פרטי. השביל לאורך נהר Azusa שטוח ועובר על שבילי עץ ובין יער, דרך Tashiro-ike. המים שקופים בצורה בולטת. כ-3.5 ק״מ והוא הקטע הכי יפה.", "tip": "לצעוד לאט, יש הרבה נקודות צילום. ממליצים על גרביים חמים ונעליים עמידות למים."}, {"t": "12:00", "name": "גשר Kappa-bashi", "type": "must", "lat": 36.2515, "lng": 137.6377, "d": "משם אוטובוס חזרה. התחנה ליד הגשר.", "info": "Kappa-bashi הוא גשר העץ הסמלי של Kamikochi, ונקודת התצפית הידועה ביותר בעמק. ממנו רואים את הרי Hotaka מעל הנהר. סביבו שירותים, חנויות ותחנת האוטובוס חזרה.", "tip": "מתחנת האוטובוס קרובה לגשר. לבדוק את שעת האוטובוס האחרון לפני שממשיכים."}, {"t": "12:15", "name": "Myōjin-ike (הלוך וחזור מהגשר)", "type": "opt", "lat": 36.2553, "lng": 137.663, "d": "עוד כשעה וחצי. רק אם כולם עם אנרגיה והשמיים פתוחים.", "info": "Myōjin-ike היא בריכה קדושה ליד מקדש Hotaka, עם מים צלולים והרים מתהפכים בהם. ליד הבריכה סירות עץ מסורתיות. שקט שם אמיתי ופחות אנשים.", "tip": "רק אם יש אנרגיה והשמיים פתוחים. כניסה למקדש בתשלום, לבדוק."}, {"t": "13:00", "name": "🚌 חזרה ל-Sawando ו-🚗 דרך מנהרת Abō לשינהוטאקה (כשעה)", "move": true}, {"t": "14:15", "name": "רכבל Shinhotaka: הקרון הדו-קומתי", "type": "must", "lat": 36.286, "lng": 137.576, "d": "עולים ל-2,156 מ׳ ורואים את האלפים הצפוניים. למעלה קר מאוד.", "info": "רכבל Shinhotaka הוא רכבל עם קרון דו-קומתי, ייחודי ליפן, שעולה ל-2,156 מ׳ בשני שלבים. מלמעלה נוף של האלפים הצפוניים. בנובמבר יכול להיות שלג וקר מאוד. יש שם תצפית ושביל קצר.", "tip": "להתלבש חם מאוד. לבדוק שעות פעולה אחרונות והאם הרכבל פועל, בגלל מזג האוויר."}, {"t": "16:00", "name": "מפל Hirayu Ōtaki", "type": "opt", "lat": 36.1785, "lng": 137.556, "d": "5 דק׳ מהכביש.", "info": "Hirayu Ōtaki הוא מפל של כ-64 מטר באזור Hirayu, בין עצי יער. בחורף הוא קופא לעמודי קרח. העצירה קצרה והמפל ליד הכביש.", "tip": "5 דקות הליכה מהכביש. אם כבר חשוך או קר מאוד, מוותרים."}, {"t": "או", "name": "Shinhotaka no Yu: אונסן בנהר", "type": "opt", "lat": 36.288, "lng": 137.577, "d": "היה ברשימה שלכם. אונסן פשוט, ליד הרכבל.", "info": "Shinhotaka no Yu הוא אונסן פתוח על גדת נהר באזור Okuhida. טובלים במים חמים בין ההרים והיער, באוויר קר. המקום פשוט ולא פאר.", "tip": "הוזכר ברשימה שלכם. להביא מגבת, ולבדוק שעות פתיחה."}, {"t": "16:50", "name": "🚗 לטאקאיאמה (כשעה)", "move": true}], "note": "<b>🌙 בערב אין בלוק, בכוונה.<\/b> טאקאיאמה נסגרת בסביבות 18:00, ומחר יוצאים ב-07:00. <b>❄️ צמיגי חורף: חובה?<\/b> לא לפי החוק. חובה רק כשיש שלט של הגבלת שלג על הכביש. בתחילת נובמבר ברוב השנים אין שלג בכביש 158 ובמנהרת Abō, אבל בגובה של Shinhotaka זה אפשרי. <b>למה זה לא ברירת מחדל:<\/b> אודווארה היא אזור חם, ובסניפים של טויוטה עונת החורף מתחילה בערך בדצמבר. אז מבקשים במייל. אם אין, בודקים את התחזית ב-8/11 בערב. אסף נוהג.", "sec": "alps", "base": {"name": "Takayama Abode", "lat": 36.14202, "lng": 137.26475}, "about": "יום הרים ארוך ברכב: טירת מאטסומוטו מבחוץ, ההליכה בקמיקוצ׳י, רכבל Shinhotaka, ובערב טאקאיאמה.", "dec": "אסף נוהג. צמיגי חורף ו-ETC: נשלח מייל לטויוטה.", "intro": "יום ארוך בהרים של האלפים היפניים. מתחילים בטירה השחורה של Matsumoto, עוברים לעמק Kamikochi, עולים ברכבל Shinhotaka לגובה 2,156 מ׳ ומסיימים ב-Takayama. הנהיגה ארוכה, אבל הנופים הם הסיבה לשבוע הזה.", "tips": ["הכביש מ-Matsumoto ל-Kamikochi: חונים בחניון (Sawando או Okushiojiri) ועוברים לאוטובוס, ואין כניסה לרכב פרטי. לבדוק מראש את החניון ומחיר האוטובוס.", "מזג האוויר ב-Kamikochi: קר ורטוב לפעמים. לבוש בשכבות, כפפות וכובע. נעליים סגורות וחזקות.", "ב-Shinhotaka למעלה יכול להיות שלג וקרח. מעיל חם, כפפות, וגרביים חמים.", "צמיגי חורף: חובה רק אם יש שלט שלג על הכביש. לבדוק תחזית בערב 8/11.", "Takayama נסגרת כמעט בשעה 18:00, אז אין תוכנית ערב. חזרה למלון ומנוחה."]}, {"id": "d1011", "region": "האלפים", "date": "שלישי 10/11", "theme": "שירקאווה-גו בבוקר, טאקאיאמה אחר הצהריים", "color": "#f5b83d", "status": "open", "ride": "🚗 כשעה ו-40 דק׳", "walk": "כ-8 ק״מ", "stops": [{"t": "07:00", "name": "שוק הבוקר Miyagawa", "type": "opt", "isNew": true, "lat": 36.1425, "lng": 137.26, "d": "על הנהר, מ-07:00. ירקות, מלאכות ובובות Sarubobo. 30 דק׳ לפני היציאה.", "info": "שוק Miyagawa פועל לאורך הנהר כבר מאות שנים. מוכרים ירקות, ירקות כבושים, פירות ומלאכות יד, כולל בובות Sarubobo. זו דרך נחמדה להכיר את העיר לפני ההמון.", "tip": "פירות או חטיפים ארוזים בלבד (לבדוק כשרות). 30 דקות מספיקות."}, {"t": "08:00", "name": "🚗 לשירקאווה-גו (50 דק׳)", "move": true}, {"t": "08:50", "name": "תצפית Shiroyama על כפר בתי הקש", "type": "must", "lat": 36.2635, "lng": 136.908, "d": "עולים לפני האוטובוסים המאורגנים. החניה: Seseragi Park.", "info": "Shiroyama הוא התצפית הקלאסית על Shirakawa-go. מכאן רואים את הכפר כולו, עם בתי הקש בין השדות, וזו התמונה המפורסמת ביותר שלו. עולים לפני האוטובוסים המאורגנים.", "tip": "חונים ב-Seseragi Park ועולים ברגל. אם יש קרח בשביל, עולים לאט."}, {"t": "09:30", "name": "הכפר Ogimachi ובית Wada-ke", "type": "must", "lat": 36.259, "lng": 136.9065, "info": "Ogimachi הוא הכפר הגדול ב-Shirakawa-go, וחלק מאתר מורשת עולמית של UNESCO מ-1995. בתי gasshō-zukuri הם בתים עם גג קש תלול שדומה לכפות ידיים בתפילה. הגג התלול מתמודד עם שלג כבד. Wada-ke הוא הבית הגדול ביותר ופתוח למבקרים.", "tip": "לבדוק מחיר ושעות הכניסה ל-Wada-ke. בבתי הקש לוקחים נעליים בכניסה."}, {"t": "10:30", "name": "Myōzen-ji וגשר Deai", "type": "opt", "lat": 36.257, "lng": 136.904, "info": "Myōzen-ji הוא מקדש בודהיסטי בכפר, עם בניין בסגנון gasshō. גשר Deai הוא גשר תלוי שמחבר את הכפר לצד השני של הנהר. משם נוף יפה לבתים.", "tip": "הגשר מתנדנד קצת. מי שלא נוח לו יכול לצפות מהצד."}, {"t": "11:15", "name": "🚗 חזרה לטאקאיאמה (50 דק׳)", "move": true}, {"t": "או", "name": "Hida Furukawa: עיירת התעלות עם הקרפיונים", "type": "opt", "lat": 36.24128, "lng": 137.15327, "d": "היה אצלכם כ\"לא חובה\". זה עוד שעה, וזה דומה לטאקאיאמה. הייתי מוותר.", "info": "Hida Furukawa היא עיירה מסורתית ליד Takayama, עם תעלת מים ומחסני בוץ לבנים. בתעלה שוחים קרפיונים צבעוניים. האווירה שקטה ואותנטית.", "tip": "זה עוד שעה נסיעה והסגנון דומה ל-Takayama. אפשרי רק אם יש עודף זמן."}, {"t": "או", "name": "Oyadani no Yu או Iwama Onsen: אונסן בטבע ליד שירקאווה-גו", "type": "opt", "lat": 36.205, "lng": 136.79, "d": "מהתוכנית שלכם. כנה: שניהם בהרים ובכבישים צרים, ובנובמבר הם עלולים להיות סגורים לחורף. לבדוק שהם פתוחים לפני שמכניסים.", "info": "Oyadani no Yu ו-Iwama Onsen הם אונסנים בהרים ליד Shirakawa-go. מתאימים לטבילה אחרי נסיעה. הכבישים צרים ובנובמבר חלק עלולים להיות סגורים."}, {"t": "12:30", "name": "Hida no Sato: כפר הפולקלור", "type": "must", "lat": 36.13249, "lng": 137.23509, "d": "זה היה \"הכי מומלץ\" אצלכם, ובצדק.", "info": "Hida no Sato הוא מוזיאון פתוח של בתים מסורתיים מכל האזור, שהועברו לכאן ושוחזרו. אפשר להיכנס לבתים, לראות כלי עבודה ישנים ולהבין איך חיו בכפרי ההרים. יש שם גם כמה בתי gasshō, והם נראים כמו Shirakawa-go בקטן.", "tip": "להקדיש שעה לפחות. לבדוק שעות סגירה."}, {"t": "13:45", "name": "סדנת Sarubobo או גילוף Ichii Ittōbori", "type": "opt", "isNew": true, "lat": 36.134, "lng": 137.237, "d": "המלאכה של הידה. לבדוק איפה יש סדנה באותו יום.", "info": "Sarubobo הוא קמע מסורתי של Hida: בובת קוף אדומה בלי פנים ששומרת על אימהות וילדים. אפשר לתפור אחת בסדנה. Ichii Ittōbori הוא גילוף עץ מסורתי מעץ yew של האזור, בסכין אחת."}, {"t": "14:45", "name": "Takayama Jinya: בניין הממשל מתקופת אדו", "type": "must", "lat": 36.13963, "lng": 137.2576, "d": "בחורף נסגר ב-16:30.", "info": "Takayama Jinya הוא בניין ממשל מימי Edo, ששימש כמשרד אזורי של השוגונט. זהו המבנה האחרון מסוגו שנשמר. יש בו חדרי טטמי, אולם מחוזי ואסם אורז גדול. היסטוריה אמיתית.", "tip": "בחורף נסגר ב-16:30, אז להגיע לפני. בתוך הבניין הולכים בלי נעליים, אז גרביים נקיים."}, {"t": "15:45", "name": "Sanmachi Suji וגשר Nakabashi האדום", "type": "must", "lat": 36.14132, "lng": 137.25962, "info": "Sanmachi Suji הם שלושה רחובות עתיקים עם בתי סוחרים ובתי מבשלות סאקה. כדורי ארז תלויים מעל הדלתות מסמנים שהסאקה החדשה מוכנה. גשר Nakabashi האדום הוא נקודת הצילום הידועה.", "tip": "מבשלות הסאקה הן אלכוהול, ואין צורך לטעום. נהנים מהאווירה והבתים."}, {"t": "16:30", "name": "Takayama Shōwa-kan: מוזיאון יפן של שנות ה-50", "type": "opt", "lat": 36.144, "lng": 137.26, "d": "יפן הרטרו, בקטן. היה ברשימה שלכם.", "info": "Takayama Shōwa-kan הוא מוזיאון נוסטלגי על יפן של שנות ה-50 וה-60. חנויות, פרסומות וצעצועים מהתקופה. נעים למבוגרים שזוכרים וכיף גם לצעירים.", "tip": "לבדוק שעות סגירה, המוזיאונים הקטנים נסגרים מוקדם."}, {"t": "או", "name": "Yatai Kaikan: עגלות הפסטיבל", "type": "opt", "lat": 36.147, "lng": 137.26, "d": "העגלות המפורסמות של טאקאיאמה. נסגר בסביבות 16:30–17:00.", "info": "Yatai Kaikan מציג את עגלות הפסטיבל של Takayama, מעוטרות בגילוף ולכה. הן גדולות מאוד ומשמשות בפסטיבלים. חלקן עם בובות מכניות.", "tip": "נסגר בערך 16:30–17:00. לבדוק שעות."}, {"t": "17:00", "name": "מסלול המקדשים Higashiyama ו-Hida Kokubunji", "type": "opt", "lat": 36.1435, "lng": 137.253, "d": "בדמדומים.", "info": "שביל מקדשים שקט בצד Higashiyama של העיר. ב-Hida Kokubun-ji יש פגודה בת שלוש קומות ועץ גינקו שנאמר כי הוא בן כ-1,200 שנה. בדמדומים המקום שקט מאוד.", "tip": "אם חשוך מדי, לא חייבים להשלים את כל המסלול."}], "note": "מחר יוצאים ב-05:30. ערב קצר.", "sec": "alps", "base": {"name": "Takayama Abode", "lat": 36.14202, "lng": 137.26475}, "about": "כפר בתי הקש בשירקאווה-גו בבוקר, לפני האוטובוסים. אחר הצהריים טאקאיאמה: Hida no Sato, Jinya ו-Sanmachi.", "dec": "Sarubobo אופציה בלבד. בלי סדנה חובה.", "intro": "בבוקר נוסעים ל-Shirakawa-go, כפר בתי הקש, לפני שמגיעים האוטובוסים. אחר הצהריים חוזרים ל-Takayama לכפר הפולקלור, לבית הממשל הישן ולרחובות העתיקים. הערב קצר כי מחר יוצאים ב-05:30.", "tips": ["בבוקר בכפרים ההרריים קר ועלול להיות קרח על הכביש. נוסעים לאט.", "ב-Shirakawa-go חונים בחניון ולא בכפר עצמו. מביאים מזומן לכניסות קטנות.", "ב-Takayama הרבה סגור סביב 17:00. לבדוק שעות לפני.", "ללבוש נעליים נוחות, באזור הכפרים יש חצץ ושלג אפשרי.", "מחר יוצאים מוקדם: לארוז הערב."]}, {"id": "d1111", "region": "האלפים", "date": "רביעי 11/11", "theme": "Kurobe ← טויאמה / טאקאוקה ← קנאזאווה", "color": "#5aa9ff", "status": "booked", "ride": "🚗 כ-4:15 שעות + 🚃 2 שעות", "walk": "כ-4 ק״מ", "stops": [{"t": "05:30", "name": "🚗 ל-Unazuki (כ-2:30 שעות)", "move": true}, {"t": "08:00", "name": "איסוף הכרטיסים בתחנת Unazuki", "type": "must", "book": true, "lat": 36.815, "lng": 137.586, "d": "מקבלים את הכרטיסים בקופה, עם דף ההזמנה המודפס או ה-QR.", "bk": "done", "info": "הכרטיסים נאספים בקופת תחנת Unazuki, תחנת המוצא של רכבת ה-Kurobe. מציגים את ההזמנה המודפסת או את ה-QR. זו נקודת איסוף בלבד, ללא מה לראות.", "tip": "להגיע כמה דקות מוקדם. ההזמנה היא על שם ענבל."}, {"t": "08:17", "name": "רכבת הטרולי של Kurobe ל-Kanetsuri (קרונות סגורים)", "type": "must", "book": true, "lat": 36.795, "lng": 137.615, "d": "<b>הוזמן:<\/b> אישור 628937, על שם ענבל. מגיעים ל-Kanetsuri ב-09:12. להדפיס את דף ההזמנה (kurobe-reservation.html) ולהביא לקופה, או להראות את ה-QR מהמייל.", "info": "רכבת הטרולי הקטנה של ערוץ Kurobe נוסעת לאורך אחד העמקים העמוקים ביפן. היא עוברת על גשרים ומנהרות מעל הנהר, עם צבעי הסתיו מסביב. בנובמבר הקרונות סגורים, אבל הנוף אותו נוף. הנסיעה ל-Kanetsuri נמשכת בערך שעה.", "bk": "done", "tip": "לשבת ליד חלון. הרכבת איטית, כדאי להכין מצלמה."}, {"t": "09:12", "name": "Kanetsuri: שבילי הנהר והאונסן שעל הגדה", "type": "must", "lat": 36.78, "lng": 137.633, "info": "Kanetsuri היא תחנה בעומק העמק עם שבילי נהר ואונסן על הגדה. אפשר ללכת לאורך המים, ולטבול רגליים אם יש מים חמים בנקודות מסוימות. שקט ויפה ופחות תיירים מהשאר.", "tip": "לבדוק שעות הרכבת חזרה לפני שמתרחקים."}, {"t": "11:24", "name": "🚃 חזרה ל-Unazuki (מגיעים ב-12:23)", "move": true, "d": "הוזמן, באותו אישור."}, {"t": "12:45", "name": "🚗 לכיוון טויאמה או טאקאוקה (כשעה)", "move": true}, {"t": "14:00", "name": "Nousaku בטאקאוקה: סיור במפעל ויציקת פח", "type": "must", "isNew": true, "book": true, "lat": 36.72, "lng": 136.98, "d": "יוצקים בעצמכם כלי פח, בערך שעה.", "info": "Nousaku בטאקאוקה הוא מפעל שיוצר כלים מפח (tin). טאקאוקה היא עיר עם מסורת יציקת מתכת של יותר מ-400 שנה. הפח רך, ואפשר אפילו לכופף קערה ביד. בסדנה יוצקים בעצמכם כלי קטן, ושומעים את סיפור המקום.", "bk": "todo", "todo": "סדנה קטנה, מעט מקומות. להזמין בהקדם.", "tip": "מזמינים מראש. הפעילות כשעה, לבדוק אם הכלי נשלח או נאסף."}, {"t": "או", "name": "Toyama Glass Art Museum", "type": "opt", "lat": 36.693, "lng": 137.212, "d": "בניין של Kengo Kuma, עם גן הזכוכית של Chihuly. היה ברשימה שלכם.", "info": "Toyama Glass Art Museum תוכנן בידי Kengo Kuma ומשולב בספרייה העירונית. יש בו תערוכות של אמנות זכוכית מודרנית ועבודות בצבעים. הוא עצירה קצרה בעיר.", "tip": "לבדוק שעות פתיחה לפני. אם בוחרים בזה, מוותרים על חלק מהזמן בטאקאוקה."}, {"t": "15:30", "name": "Takaoka Daibutsu ורחוב היוצקים Kanaya-machi", "type": "opt", "isNew": true, "lat": 36.7473, "lng": 137.0203, "d": "בודהה מברונזה ורחוב אבן ישן. חינם, 20 דק׳.", "info": "Takaoka Daibutsu הוא פסל בודהה מברונזה בגובה כ-16 מטר, ונחשב אחד משלושת הבודהות הגדולים ביפן. הרחוב Kanaya-machi הסמוך הוא רחוב היוצקים הישן, עם בתים מעץ וחנויות כלי מתכת. טאקאוקה היא עיר היציקה של יפן.", "tip": "חינם ולוקח כ-20 דקות. מתאים לטיול רגלי קצר לפני הנסיעה."}, {"t": "16:30", "name": "🚗 לקנאזאווה (45 דק׳)", "move": true}], "eve": {"t": "18:00", "opts": [{"name": "שער Tsuzumi-mon המואר בתחנת קנאזאווה", "isNew": true, "lat": 36.5781, "lng": 136.6478, "d": "שער עץ ענק וכיפת זכוכית. חינם, 20 דק׳.", "info": "שער Tsuzumi-mon בכניסה לתחנת קנאזאווה הוא שער עץ בצורת תוף tsuzumi, ומאחוריו כיפת הזכוכית Motenashi Dome. בערב הוא מואר, והוא סמל העיר. הוא קרוב לתחנה.", "tip": "חינם, 20 דקות. אפשר לשלב עם הליכה לדירה."}, {"name": "מנוחה והתארגנות בדירה", "lat": 36.56911, "lng": 136.65529, "d": "היום התחיל ב-05:30. זו גם אופציה טובה.", "info": "היום התחיל ב-05:30, ולכן ערב רגוע בדירה הוא אפשרות טובה. אפשר לארגן את הדברים ולנוח לפני שני ימים של הליכה.", "tip": "להכין תיק ליום פוקוי מחר."}]}, "note": "<b>רובע Higashi Chaya בלילה ירד מהיום הזה.<\/b> הוא נמצא ב-13/11 בבוקר, ביחד עם סדנת הזהב, כדי שלא נבקר באותו מקום פעמיים.", "sec": "alps", "base": {"name": "הדירה בקנאזאווה (Oyamamachi)", "lat": 36.56911, "lng": 136.65529}, "about": "יוצאים ב-05:30 לרכבת הטרולי של ערוץ Kurobe, ואז יציקת פח בטאקאוקה בדרך לקנאזאווה.", "dec": "Nousaku: מזמינים. 05:30 זה כמעט זריחה, לא חושך.", "intro": "יום מוקדם עם רכבת טרולי בערוץ Kurobe, אחד העמקים העמוקים ביפן, ואחר כך יציקת פח בטאקאוקה. בערב מגיעים לקנאזאווה, שתהיה הבסיס לשלושת הימים הבאים.", "tips": ["יציאה ב-05:30. לתכנן עצירת קפה או חטיף ארוז מהרכב (לבדוק כשרות).", "קר מאוד בערוץ, ובקרונות הסגורים עדיין צריך מעיל, כובע וכפפות.", "להדפיס את דף ההזמנה או לשמור QR במייל, כי הקופה בתחנה.", "בטאקאוקה לבדוק שהסדנה אישרה את השעה.", "לתדלק בדרך לפני הכניסה לקנאזאווה, כי מחר שוב נוסעים (פוקוי)."]}, {"id": "d1211", "region": "קנאזאווה", "date": "חמישי 12/11", "theme": "פוקוי: דינוזאורים ואייהיג׳י, ואז החזרת הרכב", "color": "#c084fc", "status": "booked", "ride": "🚗 כ-3:30 שעות", "walk": "כ-5 ק״מ", "stops": [{"t": "07:20", "name": "🚗 ל-Katsuyama (כשעה ו-45 דק׳)", "move": true}, {"t": "09:30", "name": "מוזיאון הדינוזאורים של פוקוי", "type": "must", "book": true, "lat": 36.08229, "lng": 136.50666, "d": "הוזמן. שעתיים.", "info": "מוזיאון הדינוזאורים של פוקוי הוא אחד המוזיאונים הגדולים בעולם בתחום. פוקוי היא האזור ביפן שבו נמצאו הכי הרבה מאובני דינוזאורים. התערוכה כוללת עשרות שלדים שלמים ודגמים נעים, כולל מינים שנמצאו באזור. מתאים לכל הגילאים.", "bk": "done", "tip": "הוזמן ל-09:30, כשעתיים. עדיף להתחיל מהאולם הראשי הגדול."}, {"t": "11:30", "name": "🚗 לאייהיג׳י (45 דק׳)", "move": true}, {"t": "12:15", "name": "מקדש הזן Eihei-ji", "type": "must", "lat": 36.09233, "lng": 136.29908, "d": "הולכים בגרביים בלבד, ולכן גרביים תרמיות עבות.", "info": "Eihei-ji הוא מקדש זן פעיל שנוסד ב-1244 בידי הנזיר Dōgen, מייסד אסכולת Sōtō. נזירים מתאמנים כאן עד היום, והמסלול עובר במסדרונות עץ ארוכים בין אולמות. האווירה שקטה מאוד והמקדש נבנה בין עצי ארז גבוהים.", "tip": "לשמור על שקט. לבדוק כללי צילום בפנים."}, {"t": "14:15", "name": "Tōjinbō: צוקי בזלת מעל הים", "type": "opt", "isNew": true, "lat": 36.238, "lng": 136.1235, "d": "40 דק׳ מאייהיג׳י. עמודי סלע של 25 מ׳ מעל ים יפן. חינם. אם הולכים לכאן, Natadera עובר ל-16:00.", "info": "Tōjinbō הם צוקים אנכיים של סלע געשי, בגובה כ-25 מ
