 ליד הדירה בקיוטו, ואוספים שם בערב של 15/11. עלות בערך 2,500 ין למזוודה.", "tip": "לכתוב על הטופס 営業所止め. לשמור על מספר מעקב. לבדוק שמזוודות מתאימות לגודל."}, {"t": "10:35", "name": "Nomura Samurai House: בית סמוראי וגן קטן", "type": "opt", "lat": 36.5627, "lng": 136.6499, "d": "מנסים להספיק גם את זה וגם את Kazuemachi. 10 דק׳ במונית. כ-45 דק׳.", "info": "Nomura Samurai House הוא בית סמוראי משוחזר ב-Nagamachi, עם גן יפני ובריכת דגים. מגישים מאצ׳ה בחדר שמשקיף על הגן. הוא מראה איך חיה משפחת סמוראים בתקופת Edo.", "tip": "10 דקות במונית. הביקור כ-45 דקות. מאצ׳ה בתשלום, לבדוק אם רוצים."}, {"t": "11:20", "name": "שוק Ōmichō: קניות לשבת", "type": "must", "lat": 36.5715, "lng": 136.6565, "d": "אין בית חב״ד בקנאזאווה, אז הכל מכאן.", "info": "שוק Ōmichō הוא השוק של קנאזאווה, פעיל כ-300 שנה עם כ-170 דוכנים. דגים, פירות, ירקות וממתקים. מקום להכיר את העיר ולקנות אוכל לשבת.", "tip": "לשבת: פירות, ירקות וחטיפים ארוזים. לבדוק כשרות על כל מוצר. מזומן."}, {"t": "12:05", "name": "קונים כרטיס נייר ל-21st Century Museum לשבת", "type": "opt", "lat": 36.5609, "lng": 136.6581, "d": "כדי להיכנס בשבת בלי לשלם באותו יום. לבדוק שהכרטיס תקף ליום אחר.", "info": "קונים כרטיס נייר ל-21st Century Museum כבר ביום שישי, כדי להיכנס בשבת בלי לשלם באותו יום. זו רק נקודת לוגיסטיקה."}, {"t": "12:30", "name": "🚶 הביתה לבשל. כניסת שבת בסביבות 16:25 (לבדוק)", "move": true}], "note": "<b>אפשר להתחייב עד 12:00.<\/b> את מקדש הנינג׳ות הורדתי לגמרי, כמו שביקשתם.", "sec": "alps", "base": {"name": "הדירה בקנאזאווה (Oyamamachi)", "lat": 36.56911, "lng": 136.65529}, "about": "שישי: Higashi Chaya עוד ריק וסדנת עלי זהב, שולחים את המזוודות לקיוטו, וקונים לשבת ב-Ōmichō. בבית ב-12:30.", "dec": "מנסים את Nomura וגם את Kazuemachi. המזוודות לסניף Yamato.", "intro": "יום שישי בקנאזאווה: בבוקר בשקט ב-Higashi Chaya, סדנת עלי זהב, וקניות לשבת בשוק. מחזירים הביתה עד 12:30 לקראת שבת.", "tips": ["התחייבויות רק עד 12:00. שבת נכנסת מוקדם בנובמבר, לבדוק את השעה המדויקת.", "הכל לשבת נקנה היום, כולל אוכל ושתיה.", "לשלוח מזוודות: לקחת את הכתובת בקיוטו בכתב יפני ולבדוק קבלה.", "לשלם במזומן בשוק, ולהביא עודף.", "אין בית חב״ד בקנאזאווה, לכן להכין הכל מראש."]}, {"id": "d1411", "region": "קנאזאווה", "date": "שבת 14/11", "theme": "שבת בקנאזאווה: גנים, מקדש, מוזיאון", "color": "#3ecf8e", "status": "shabbat", "ride": "—", "walk": "כ-8 ק״מ", "stops": [{"t": "06:30", "name": "Kenroku-en בכניסה החינמית של הבוקר", "type": "must", "isNew": true, "lat": 36.5621, "lng": 136.6627, "d": "הגן פותח שערים מסוימים בחינם בבוקר מוקדם, ויוצאים לפני שהקופות נפתחות. בנובמבר זה בערך בין 06:00 ל-07:15. לבדוק את השעות והשערים המדויקים.", "info": "Kenroku-en הוא אחד משלושת הגנים המפורסמים ביפן, שנבנה על ידי שושלת Maeda ממאה ה-17. יש בו אגמים, גשרים ופנסי אבן, ובנובמבר תולים חבלים לתמיכה בעצים לקראת השלג (yukitsuri). שערים מסוימים פתוחים בחינם בבוקר מוקדם."}, {"t": "08:30", "name": "Oyama Jinja: השער עם הוויטראז׳ ההולנדי", "type": "must", "lat": 36.5655, "lng": 136.6535, "d": "חינם.", "info": "Oyama Jinja הוא מקדש שמוקדש ל-Maeda Toshiie, מייסד קנאזאווה. השער בנוי בסגנון ייחודי: בקומה העליונה יש זכוכית צבעונית הולנדית מ-1875. שילוב יוצא דופן שמראה את הקשר עם המערב.", "tip": "חינם. להסתכל על השער מקרוב."}, {"t": "10:00", "name": "21st Century Museum", "type": "opt", "lat": 36.5609, "lng": 136.6581, "d": "האזור החינמי פתוח לכולם. לתערוכות נכנסים רק עם כרטיס הנייר שקניתם בשישי.", "info": "ה-21st Century Museum הוא מוזיאון עגול מזכוכית בעיצוב SANAA, שנפתח ב-2004. האזור החינמי פתוח לכולם. יש בו פרויקט \"בריכה\" שנראה כמו שכבת מים מעל הראש. אפשר לראות הרבה בלי כרטיס.", "tip": "לתערוכות נכנסים רק עם כרטיס הנייר מהיום שישי. בלי תשלום היום."}, {"t": "11:15", "name": "הליכה דרך Kōrinbō בחזרה הביתה", "type": "opt", "lat": 36.562, "lng": 136.653, "d": "רק עוברים שם.", "info": "Kōrinbō הוא אזור מרכזי בקנאזאווה, והדרך הביתה עוברת בו. היום רק עוברים שם, ללא קניות.", "tip": "אין צורך לעצור. הדרך שטוחה."}], "eve": {"t": "17:30", "opts": [{"name": "פארק טירת קנאזאווה ו-Gyokusen-inmaru המואר", "isNew": true, "lat": 36.564, "lng": 136.6565, "d": "לפי מה שידוע לי, הגן מואר בערבי שישי ושבת עד 21:00, בחינם. לבדוק. לכן הטירה לא בבוקר: כך מבקרים בה פעם אחת, בלילה.", "info": "פארק טירת קנאזאווה כולל את גן Gyokusen-inmaru, שמואר בסתיו. הליכה נעימה אחרי צאת השבת, עם אורות והשתקפות במים. הטירה נבנתה מחדש בחלקה, והפארק מתאים להליכה ערב.", "tip": "לפי הידוע, מואר עד 21:00 בחינם, אבל לבדוק. הליכה רק אחרי צאת השבת ובלי תשלום."}, {"name": "אריזות לקיוטו", "lat": 36.56911, "lng": 136.65529, "d": "מחר יוצאים ב-07:00.", "info": "מחר יוצאים ב-07:00 לקיוטו, ולכן ערב לארוז ולנוח. המזוודות הגדולות כבר נשלחו, אז נשארות רק תיקים קטנים.", "tip": "להכין תיק יד לנסיעה ולשמור מסמכים נגישים."}]}, "note": "Kenroku-en ו-Omichō כבר לא מופיעים פעמיים: Omichō בשישי, Kenroku-en עכשיו בחינם.", "sec": "alps", "base": {"name": "הדירה בקנאזאווה (Oyamamachi)", "lat": 36.56911, "lng": 136.65529}, "about": "שבת בקנאזאווה: Kenroku-en בכניסה החינמית של הבוקר, Oyama Jinja, ו-21st Century Museum. בערב הגן המואר של הטירה.", "dec": "", "intro": "שבת בקנאזאווה, הכל ברגל ושום דבר בתשלום. בבוקר גן Kenroku-en בשעות הכניסה החינמית, אחר כך מקדש Oyama ומוזיאון. בסוף השבת יוצאים לגן המואר של הטירה.", "tips": ["הכל ברגל. שום קנייה, תשלום או כרטיס חדש היום.", "בבוקר קר: מעיל וכפפות, והדרכים יכולות להיות רטובות.", "לבדוק את שעות הכניסה החינמית ל-Kenroku-en לפני.", "מחר יוצאים ב-07:00 לקיוטו: לארוז בערב.", "כל מה שצריך לשבת כבר נקנה אתמול. מחר בבוקר ארוזים ליציאה ב-07:00."]}, {"id": "d1511", "region": "קיוטו", "date": "ראשון 15/11", "theme": "קנאזאווה ← קיוטו ← נארה", "color": "#ff8a5b", "status": "booked", "ride": "🚄 2:15 שעות + 🚆 1:30 שעות", "walk": "כ-9 ק״מ", "stops": [{"t": "07:00", "name": "🚄 Hokuriku Shinkansen ל-Tsuruga, ומשם Thunderbird לקיוטו (כ-2:15 שעות). יש רק טרולים, כי המזוודות הגדולות נשלחו ב-13/11. את הטרולים שמים בלוקרים בינוניים בתחנה", "move": true, "book": true, "bk": "todo", "todo": "4 מושבים שמורים באותו קרון. אפשר ביפן, עד כשבוע לפני."}, {"t": "10:00", "name": "🚆 JR Nara line Rapid לנארה (45 דק׳)", "move": true}, {"t": "11:00", "name": "פארק נארה והאיילים", "type": "must", "lat": 34.6851, "lng": 135.843, "info": "פארק נארה הוא שטח פתוח גדול ובו מסתובבים חופשי כ-1,200 איילים. לפי המסורת הם שליחי האלים של מקדש Kasuga, ובמשך מאות שנים היה אסור לפגוע בהם. האיילים מקבלים עוגיות מיוחדות (shika senbei) ממוכרים בפארק, ורבים מהם מרכינים ראש לפני שמקבלים. אפשר פשוט להסתובב בין העצים והדשא ולהתרשם מהקרבה.", "tip": "קונים עוגיות רק כשאתם מוכנים להאכיל: כשהן ביד, האיילים מתקבצים במהירות ואפילו מושכים בבגדים. גמרתם? מראים כפות ידיים ריקות."}, {"t": "11:30", "name": "Tōdai-ji: הבודהה הגדול", "type": "must", "lat": 34.689, "lng": 135.8398, "info": "Tōdai-ji הוא מקדש בודהיסטי גדול שהוקם במאה ה-8, ואולם Daibutsu-den שלו הוא אחד ממבני העץ הגדולים בעולם. בפנים יושב פסל בודהה מברונזה בגובה כ-15 מטר, הבודהה Vairocana. הפסל נוצק בימי הקיסר Shōmu כדי להגן על המדינה, והמבנה הנוכחי, מ-1709 בקירוב, קטן מהמקורי. אחד מעמודי העץ כולל חור בגודל נחיר הבודהה, ומי שמצליח לעבור בו, לפי המסורת, יזכה לברכה.", "tip": "לבדוק לפני מה שעת הסגירה בחורף. נכנסים קודם דרך שער Nandai-mon עם פסלי השומרים הענקיים, ואל תדלגו עליו."}, {"t": "12:45", "name": "מרפסת Nigatsu-dō", "type": "opt", "isNew": true, "lat": 34.6895, "lng": 135.8445, "d": "5 דק׳ מעל Tōdai-ji. נוף על כל נארה, חינם ובלי המון.", "info": "Nigatsu-dō הוא אולם עץ על מדרון מעל Tōdai-ji. בחזית שלו מרפסת עץ רחבה, ומשם נשקפת נארה כולה. עולים אליו בשביל ומדרגות אבן, ובדרך כלל יש בו הרבה פחות אנשים מאשר למטה. שמו מקושר לטקס האביב Shuni-e, שנערך שם מאות שנים.", "tip": "הנוף יפה במיוחד בשעות אחר הצהריים. אם אתם עייפים, זה ויתור קל."}, {"t": "13:30", "name": "Kasuga Taisha ושביל אלפי הפנסים", "type": "must", "lat": 34.6812, "lng": 135.8484, "info": "Kasuga Taisha הוא מקדש שינטו שנוסד בשנת 768, והוא אחד המקדשים החשובים של משפחת Fujiwara. מבני המקדש צבועים באדום-כתום, ולאורך השבילים אליו עומדים אלפי פנסי אבן, ובתוך המקדש תלויים פנסי ברונזה רבים. הפנסים נדלקים רק בשני פסטיבלים מיוחדים בשנה, בפברואר ובאוגוסט. השביל אליו עובר ביער עתיק ובו הרבה איילים, והאווירה שקטה ופחות תיירותית מזו שליד Tōdai-ji.", "tip": "אזור המקדש הפנימי בתשלום, והשבילים והפנסים בחוץ חינם. אם הזמן קצר, השביל עם פנסי האבן הוא העיקר."}, {"t": "14:45", "name": "גן Yoshiki-en", "type": "opt", "isNew": true, "lat": 34.6855, "lng": 135.8365, "d": "גן יפני שהכניסה אליו חינם לתיירים עם דרכון.", "info": "Yoshiki-en הוא גן יפני קטן ושקט שבו שלושה אזורים נפרדים: גן הבריכה, גן האזוב וגן התה. הגן משתמש בנוף ההר שמאחוריו כחלק מהקומפוזיציה, טכניקה שנקראת shakkei. בסתיו יש בו צבעי מייפל. לפי המידע שיש לנו, הכניסה חינם לתיירים עם דרכון, ולכן כדאי לבדוק בכניסה.", "tip": "להביא דרכון. מקום טוב לעצור ולשבת שעה של שקט אחרי הפארק העמוס."}, {"t": "15:30", "name": "רובע Naramachi", "type": "must", "lat": 34.677, "lng": 135.829, "info": "Naramachi הוא הרובע ההיסטורי שהתפתח סביב מקדש Gangō-ji. מרבית הבתים הם machiya, בתי סוחרים מסורתיים צרים ועמוקים מעץ. היום יש בהם חנויות קטנות, גלריות ובתי קפה. הסמטאות שקטות, והרובע הוא מקום נעים לסיים בו את הטיול בנארה.", "tip": "בבית Naramachi Koshi-no-ie אפשר להיכנס ולראות איך נראה בית סוחרים מבפנים. לבדוק שעות פתיחה."}, {"t": "16:15", "name": "Higashimuki ו-Sanjō-dōri", "type": "opt", "lat": 34.684, "lng": 135.829, "info": "Higashimuki ו-Sanjō-dōri הם רחובות קניות מקורים וצמודים, קרוב לתחנת Kintetsu Nara. יש בהם חנויות מזכרות וחנויות כלליות. זה מקום נוח לעצירה קצרה בדרך לתחנה.", "tip": "אם מחפשים מזכרת, אפשר למצוא כאן מוצרי נארה כמו מגבות, חפצי עץ וממתקים. כל אוכל או ממתק: לבדוק כשרות לפני שקונים."}, {"t": "16:45", "name": "🚆 חזרה לקיוטו, לוקחים את הטרולים, מונית לדירה, ואוספים את המזוודות הגדולות (מהמארח או מהסניף של Yamato)", "move": true}], "eve": {"t": "18:30", "opts": [{"name": "Shōren-in: תאורת הערב של השלכת", "isNew": true, "lat": 35.007, "lng": 135.783, "d": "10 דק׳ הליכה מהדירה. מקדש שקט עם גן מואר באור כחול. לבדוק תאריכים.", "info": "Shōren-in הוא מקדש קרוב לדירה, באזור Higashiyama, ובעבר שימש כמקום מגורים לנזירים ממשפחת הקיסר. יש בו גן עם שבילים, עצי קמפור ענקיים ובריכה. בסתיו המקדש מקיים תאורת ערב מיוחדת, ולכן הגן נראה אחרת בלילה. הכניסה בכרטיס, והתאריכים ושעות התאורה משתנים משנה לשנה.", "tip": "לבדוק לפני תאריכי תאורה ושעות. אחרי יום של נסיעה זו אפשרות נוחה כי היא קרובה מאוד."}, {"name": "מנוחה", "lat": 35.00998, "lng": 135.77869, "info": "ערב חופשי אחרי יום ארוך: מגיעים לדירה, מסדרים דברים ומנוחה.", "tip": "הזדמנות לארגן את המזוודות ולתכנן את הבוקר."}]}, "note": "<b>כנה:<\/b> יש איילים גם בנארה וגם במיאג׳ימה. לא נורא, כי במיאג׳ימה הם לא העיקר.", "sec": "kyoto", "base": {"name": "הדירה בקיוטו (Sanjō-Shirakawa)", "lat": 35.00998, "lng": 135.77869}, "about": "עוברים לקיוטו ברכבת, ובאותו יום נארה: האיילים, Tōdai-ji, Kasuga Taisha ו-Naramachi. בערב מגיעים לדירה.", "dec": "", "intro": "יום מעבר מקנאזאווה לקיוטו, ובו טיול קצר לנארה, עיר הבירה הראשונה של יפן במאה ה-8. מתמקדים בפארק האיילים, בבודהה הגדול ובמקדשים שבין העצים. בסוף היום מגיעים לדירה בקיוטו.", "tips": ["לא לשכוח לתכנן מראש איפה משאירים מזוודות: הכי נוח להגיע קודם לדירה או לבדוק לוקרים בתחנת קיוטו, ולא לסחוב אותן בנארה.", "באמצע נובמבר נארה עמוסה, ובעיקר Tōdai-ji. עדיף להיכנס אליו מוקדם ככל האפשר ולהשאיר את הרחובות השקטים של Naramachi לסוף.", "שקיעה סביב 16:45, ולכן את החלק של Nigatsu-dō והפארק עושים בעוד אור.", "נעליים נוחות להליכה על חצץ וגבשושיות. הפארק גדול והמרחקים בין האתרים ארוכים מכפי שנראה במפה.", "האיילים נושכים לפעמים ואוכלים נייר ושקיות. לא מחזיקים ביד מפות או שקיות בזמן שמחזיקים עוגיות."]}, {"id": "d1611", "region": "קיוטו", "date": "שני 16/11", "theme": "מקדש הזהב, ניג׳ו וסמוראים", "color": "#f5b83d", "status": "booked", "ride": "🚌 כשעה", "walk": "כ-7 ק״מ", "stops": [{"t": "08:15", "name": "🚕 או 🚌 לקינקאקו-ג׳י (25 דק׳)", "move": true}, {"t": "09:00", "name": "Kinkaku-ji: מקדש הזהב", "type": "must", "lat": 35.0394, "lng": 135.7292, "d": "מגיעים בפתיחה.", "info": "Kinkaku-ji, מקדש הזהב, הוא ביתן בן שלוש קומות שהקומות העליונות שלו מצופות עלי זהב והוא משתקף בבריכה. הוא נבנה ב-1397 כווילה של השוגון Ashikaga Yoshimitsu, ואחרי מותו הפך למקדש זן. ב-1950 נשרף בידי נזיר צעיר, ושוחזר ב-1955. הביקור מסלול הליכה חד כיווני סביב הבריכה, כ-40 דקות.", "tip": "נקודת הצילום הטובה היא בתחילת השביל, ממול לבריכה. אחר כך ממשיכים בשביל ולא תקועים בקהל."}, {"t": "10:00", "name": "Ryōan-ji וגן האבנים", "type": "must", "lat": 35.0345, "lng": 135.7182, "d": "דרך Kinukake-no-michi, 15 דק׳ הליכה.", "info": "Ryōan-ji הוא מקדש זן מהמאה ה-15 ובו הגן היבש המפורסם ביפן. מלבן חצץ מסורק ובו 15 סלעים בקבוצות, כך שמכל נקודת ישיבה אי אפשר לראות את כולם בבת אחת. אף אחד לא יודע בוודאות מי תכנן אותו או מה הכוונה, ולכן כל אחד מפרש בדרכו. יושבים על מרפסת העץ ומתבוננים. המקדש גם חלק ממורשת עולמית.", "tip": "לשבת בקצה המרפסת אחרי שהקבוצה עוברת. יש גם גן ובריכה מאחורי המבנה שמעטים מגיעים אליהם."}, {"t": "11:00", "name": "Ninna-ji", "type": "opt", "lat": 35.031, "lng": 135.7137, "info": "Ninna-ji הוא מתחם גדול שנוסד בשנת 888, ובמשך מאות שנים שימשו בו קיסרים לשעבר כנזירים. המקום חלק ממורשת עולמית. בולטים בו שער Niō ענק ופגודה בת חמש קומות. הוא ידוע גם בעצי הדובדבן המאוחרים שלו באביב, ובסתיו פחות עמוס מאתרים אחרים בסביבה.", "tip": "הכניסה למתחם החיצוני כנראה חינם, ובתשלום לארמון הפנימי. לבדוק במקום."}, {"t": "או", "name": "Kitano Tenmangū: גן המייפלים", "type": "opt", "isNew": true, "lat": 35.0313, "lng": 135.735, "d": "פתוח רק בעונת השלכת, עם שביל מעל נחל.", "info": "Kitano Tenmangū הוא מקדש לזכר Sugawara no Michizane, מלומד מהמאה ה-9 שהפך לאל הלימודים. סטודנטים מגיעים להתפלל לפני בחינות. בסתיו נפתח גן מייפלים לאורך נחל Kamiyagawa, ובו שביל מעל הנחל. זו אחת מנקודות צבעי השלכת בצפון העיר.", "tip": "גן המייפלים נפתח רק לעונה קצרה, ובדרך כלל בתשלום. לבדוק תאריכים. הוא אלטרנטיבה ל-Daitoku-ji."}, {"t": "או", "name": "Daitoku-ji: מתחם של מקדשי זן", "type": "opt", "lat": 35.0437, "lng": 135.7463, "d": "היה אצלכם כאופציה. אוטובוס מ-Kinkaku-ji. כנה: אתם כתבתם שכנראה עמוס מדי, ואני מסכים. רק אם הקצב מהיר.", "info": "Daitoku-ji הוא מתחם גדול של מקדשי זן עם כ-20 מקדשי משנה, וחלק מהם פתוחים לקהל. בכל אחד גן אחר, ובין החומות יש שבילים שקטים. המתחם קשור להיסטוריה של טקס התה וליוצר הטקס Sen no Rikyū. בעונת השלכת הכניסה לחלק מהמקדשים מוגבלת או סגורה.", "tip": "רק אם הקצב מהיר. בוחרים אחד או שניים בלבד, ולא מנסים לראות הכול."}, {"t": "12:30", "name": "🚕 לניג׳ו (15 דק׳)", "move": true}, {"t": "13:00", "name": "Nijō-jō: ארמון Ninomaru והרצפות המצייצות", "type": "must", "book": true, "lat": 35.0142, "lng": 135.7481, "d": "הטירה היחידה שנשארה בליבה, בגלל הארמון.", "info": "Nijō-jō הוא ארמון שנבנה ב-1603 עבור השוגון הראשון של משפחת Tokugawa. אולמות Ninomaru מכוסים בציורי קיר על רקע זהב, והרצפות שלהם 'מצייצות' כשדורכים עליהן, מנגנון נגד מתנקשים. כאן הכריז השוגון האחרון Tokugawa Yoshinobu ב-1867 על החזרת השלטון לקיסר. מסביב יש חפיר וחומות אבן וגנים. הוא חלק ממורשת עולמית.", "bk": "todo", "todo": "לא נגמר. כרטיס מראש רק חוסך תור.", "tip": "בתוך אולמות Ninomaru אסור לצלם, וכמקובל מורידים נעליים. מומלץ ללכת לאט ולשים לב לרצפה ולציורים."}, {"t": "14:45", "name": "Kyoto International Manga Museum", "type": "opt", "isNew": true, "lat": 35.0117, "lng": 135.759, "d": "בית ספר ישן, 50,000 מנגות על הקירות. יפן של תרבות הפופ.", "info": "מוזיאון המנגה הוא מוזיאון בבניין של בית ספר יסודי ישן. אלפי כרכי מנגה עומדים על מדפים ארוכים ואפשר לשבת וגם לקרוא. יש גם תערוכות על התפתחות המנגה, ועל הדשא בחוץ ילדים וקוראים יושבים.", "tip": "רוב החומר ביפנית. זו עצירה אופציונלית לאוהבי התרבות ולא חובה."}, {"t": "17:00", "name": "SAMURAI NINJA MUSEUM", "type": "must", "book": true, "lat": 35.0053, "lng": 135.7652, "d": "שיעור חרב וכוכבי נינג׳ה.", "info": "SAMURAI NINJA MUSEUM הוא מוזיאון אינטראקטיבי שמציג את עולם הסמוראים והניג׳ות. יש סיור מודרך, תצוגות של שריון וחרבות, ופעילויות שבהן מנסים חרבות וכוכבי זריקה. זו חוויה שמתאימה לכל הגילאים.", "bk": "todo", "todo": "קבוצות קטנות. להזמין בהקדם, לשעה 17:00.", "tip": "הגעה 10 דקות לפני. לבדוק מראש אם הסיור מתקיים באנגלית ובאיזו שעה."}], "eve": {"t": "18:30", "opts": [{"name": "Tō-ji: הפגודה המוארת והמייפלים", "isNew": true, "lat": 34.9806, "lng": 135.7478, "d": "הפגודה הגבוהה ביפן, מוארת בעונת השלכת. לבדוק תאריכים.", "info": "Tō-ji הוא מקדש שנוסד בשנת 796, בתחילת התקופה שבה קיוטו הפכה לבירה. הפגודה בת חמש הקומות שלו, בגובה כ-55 מטר, הגבוהה ביותר ביפן. בחלק מהשנים בעונת השלכת המקדש מוארת בערב ובריכה משקפת את הפגודה. חלק ממורשת עולמית.", "tip": "לבדוק לפני תאריכים, שעות ומחיר. כשהמקדש לא מואר, הפגודה עדיין נראית מבחוץ."}, {"name": "Fushimi Sake District: תעלת Horikawa ומחסני הסאקה", "isNew": true, "lat": 34.933, "lng": 135.761, "d": "סירות עץ ומחסנים שחורים מתקופת אדו. בערב שקט וכמעט ריק. 20 דק׳ ברכבת Keihan.", "info": "Fushimi היא אזור מסורתי של יצרני סאקה, והיא קיימת כך מאות שנים בזכות מי המעיינות. לאורך תעלת Horikawa יש מחסני סאקה שחורים ובתים ישנים, וכמה סירות עץ. נוסעים בקו Keihan כ-20 דקות. Teradaya היא אכסניה היסטורית שקשורה ל-Sakamoto Ryōma ולמאבק לפני מהפכת Meiji.", "tip": "בערב רוב החנויות סגורות, ולכן זה בעיקר טיול. לא טועמים סאקה או אוכל בלי לבדוק כשרות."}]}, "sec": "kyoto", "base": {"name": "הדירה בקיוטו (Sanjō-Shirakawa)", "lat": 35.00998, "lng": 135.77869}, "about": "צפון-מערב קיוטו: Kinkaku-ji בפתיחה ו-Ryōan-ji, ארמון Nijō, ומוזיאון הסמוראים והנינג׳ות ב-17:00.", "dec": "הוחלף עם 17/11, כי השייט ב-Hozugawa הוזמן ליום שלישי.", "intro": "יום בצפון-מערב קיוטו שעובר דרך כמה מהמקומות המפורסמים ביותר בעיר: מקדש הזהב, גן האבנים וארמון ה-Nijō. את היום מסיימים בחוויה אינטראקטיבית של סמוראים וניג׳ות.", "tips": ["Kinkaku-ji פתוח מ-09:00. מי שמגיע בפתיחה נהנה מפחות אנשים, ובשיא השלכת התור לכניסה גדל מהר.", "הקטע בין המקדשים בצפון-מערב ארוך, והאוטובוסים מלאים בעונה הזו. כדאי לבדוק מראש אם מונית משתלמת בחלק מהקטעים.", "הארמון Nijō סוגר מוקדם יחסית. לבדוק שעות סגירה וימי סגירה.", "שקיעה בסביבות 16:45, ולכן בנסיעה אל המוזיאון בערב כבר חשוך.", "להביא כסף מזומן: בחלק מהמקדשים משלמים בכניסה במזומן."]}, {"id": "d1711", "region": "קיוטו", "date": "שלישי 17/11", "theme": "אראשייאמה: במבוק, רכבת רומנטית ושייט", "color": "#3ecf8e", "status": "booked", "ride": "🚕 25 דק׳ + 🚃 45 דק׳", "walk": "כ-8 ק״מ", "stops": [{"t": "07:15", "name": "🚕 מונית לאראשייאמה (25 דק׳)", "move": true}, {"t": "07:45", "name": "יער הבמבוק", "type": "must", "lat": 35.017, "lng": 135.6717, "d": "לפני 08:30 הוא כמעט ריק.", "info": "יער הבמבוק של Arashiyama (Sagano) הוא שביל צר בין גבעולי במבוק גבוהים מאוד שמתנועעים ברוח. הצליל והאור המסונן הם הסיבה שבאים. ההליכה בו קצרה, כמה מאות מטרים. מוקדם בבוקר הוא שקט יחסית, ובהמשך היום עמוס מאוד.", "tip": "מגיעים לפני 08:30 ולא נעצרים באמצע השביל, כי שם נוצר פקק."}, {"t": "08:30", "name": "Tenryū-ji וגן הזן", "type": "must", "lat": 35.0158, "lng": 135.6738, "info": "Tenryū-ji הוא מקדש זן שהוקם ב-1339 על ידי Ashikaga Takauji, והוא חלק ממורשת עולמית. גן הבריכה שלו הוא מהגנים העתיקים בקיוטו שנשמרו כמעט כפי שהיו, ומשתמש בהרים שמאחוריו בתור רקע. בסתיו הוא אחד המקומות היפים לצבעים. היציאה מהגן הצפוני מובילה ישר אל יער הבמבוק.", "tip": "אפשר לקנות כניסה לגן בלבד. הכניסה לאולמות בתשלום נוסף."}, {"t": "09:30", "name": "Ōkōchi Sansō", "type": "opt", "lat": 35.0175, "lng": 135.67, "d": "וילה וגן בקצה הבמבוק, עם תצפית. בכרטיס כלול תה.", "info": "Ōkōchi Sansō הוא וילה וגן שהקים שחקן הקולנוע Ōkōchi Denjirō. שבילים מתפתלים בגן מובילים אל תצפית על קיוטו ועל נהר Katsura. הכניסה כוללת תה ומאצ׳ה וקינוח קטן. הגן שקט ופחות עמוס מהמקדשים.", "tip": "כשרות התה והקינוח: לבדוק לפני שאוכלים. יש עלייה בשביל, בצעדים נוחים."}, {"t": "או", "name": "Otagi Nenbutsu-ji: 1,200 פסלי אבן מצחיקים", "type": "opt", "isNew": true, "lat": 35.031, "lng": 135.662, "d": "יפן המוזרה בגרסת מקדש. כל פסל עם פרצוף אחר. 10 דק׳ במונית.", "info": "Otagi Nenbutsu-ji הוא מקדש קטן בהרים מצפון לאראשייאמה, ובו כ-1,200 פסלי אבן של תלמידי בודהה (rakan). הפסלים נחצבו בידי מתנדבים במאה ה-20, ולכל אחד פרצוף ופוזה שונים. רבים מכוסים באזוב, והמקום מזכיר גן קסמים.", "tip": "מרוחק מהמרכז, ולכן נוסעים במונית או באוטובוס. אם הזמן קצר, זה לא חובה."}, {"t": "או", "name": "Iwatayama Monkey Park", "type": "opt", "lat": 35.0094, "lng": 135.6776, "d": "היה אצלכם אופציונלי. 20 דק׳ עלייה.", "info": "Iwatayama Monkey Park הוא פארק על הר ובו כ-160 מקאקים יפניים שחיים חופשי. הטיפוס אל הפסגה אורך כ-20 דקות בשביל תלול. למעלה נוף על קיוטו, ואת הקופים מאכילים מתוך בית עם רשת, כך שהם בחוץ ואתם בפנים.", "tip": "זו עלייה תלולה יחסית, ולכן מתאים אם יש כוח. לא מסתכלים לקופים בעיניים ולא מראים אוכל בחוץ."}, {"t": "12:00", "name": "Sagano Romantic Train מ-Saga-Torokko ל-Kameoka", "type": "must", "book": true, "lat": 35.0187, "lng": 135.681, "d": "<b>הוזמן:<\/b> 17/11 ב-12:00, 4 אנשים. מגיעים ל-Torokko Kameoka בערך ב-12:25.", "info": "Sagano Scenic Railway (הרכבת הרומנטית) היא רכבת קטנה בסגנון ישן שעוברת כ-25 דקות לאורך עמק נהר Hozu, מתחנת Saga-Torokko ועד Kameoka. יש בה גם קרון פתוח, והנוף כולל צוקים ונהר, ובסתיו צבעי השלכת. ההזמנה היא ל-12:00 ל-4 אנשים.", "bk": "done", "tip": "מתיישבים בצד של הנהר. מגיעים לתחנה זמן קצר לפני, ולוקחים בחשבון שהקרונות קרים."}, {"t": "12:25", "name": "🚌 מ-Torokko Kameoka לרציף השייט (כ-15 דק׳)", "move": true, "d": "<b>לא בדקתי איך בדיוק עוברים.<\/b> יש כמה אפשרויות: אוטובוס, מונית, או JR תחנה אחת ל-Kameoka ואז כ-10 דק׳ הליכה. לשאול בתחנה כשמגיעים."}, {"t": "12:45", "name": "🍜 ארוחת צהריים ליד הרציף בקמאוקה", "move": true, "d": "כשעה עד השייט. להיות ברציף עד 13:40."}, {"t": "14:00", "name": "שייט Hozugawa חזרה לאראשייאמה (שעתיים)", "type": "must", "book": true, "lat": 35.0144, "lng": 135.5877, "info": "שייט Hozugawa הוא שייט של כשעתיים בסירות עץ מסורתיות שמנווטים בהן שלושה נווטים עם מוטות. השייט עובר בין צוקים ובאשדות קטנים, וזו מסורת ישנה. הוזמן ל-14:00 ל-4 אנשים. מחיר ההזמנה היה 144$ בסך הכל.", "d": "<b>הוזמן:<\/b> 17/11 ב-14:00, 4 אנשים, 144$ בסך הכל.", "bk": "done", "tip": "הסירה פתוחה, ויכולים להתיז מים. מביאים מעיל אטום ושקית לטלפון ולמצלמה. לבדוק מראש שהשייט פועל בהתאם לרמת המים."}, {"t": "16:00", "name": "גשר Togetsukyō", "type": "must", "lat": 35.0129, "lng": 135.6778, "d": "הסירה עוגנת ממש לידו.", "info": "גשר Togetsukyō, 'גשר הירח החוצה', הוא הסמל של אראשייאמה והוא חוצה את נהר Katsura. גשר עומד כאן מאז תקופת Heian, והגשר הנוכחי הוא משנת 1934. בסתיו ההרים מאחוריו אדומים.", "tip": "הנוף הכי טוב מהגדה הדרומית. הצילום בשעה הזאת עם אור רך."}, {"t": "16:30", "name": "הרחוב הראשי של אראשייאמה", "type": "opt", "lat": 35.015, "lng": 135.677, "info": "הרחוב הראשי של אראשייאמה צמוד לתחנת Randen ולגשר, ובו חנויות מזכרות, בתי תה וממתקים. סוף היום הוא זמן טוב לטייל בו בנחת.", "tip": "כל ממתק או מאפה: לבדוק כשרות לפני שקונים."}], "eve": {"t": "17:30", "opts": [{"name": "Pontochō וגדת נהר קאמו", "isNew": true, "lat": 35.0055, "lng": 135.771, "d": "הסמטה הצרה עם הפנסים. רק הליכה.", "info": "Pontochō היא סמטה צרה ומקושטת בפנסי נייר במרכז קיוטו, במקביל לנהר Kamo. היא מוכרת בעיקר כמקום של מסעדות ובתי תה, אבל מספיק לטייל בה ובגדה כדי לתפוס את האווירה. בקיץ מסעדות מעמידות מרפסות על הנהר, ובנובמבר שקט יותר.", "tip": "הליכה בלבד, בלי כניסה למסעדות. השביל לאורך נהר Kamo נעים ומואר."}, {"name": "בניין תחנת קיוטו: המדרגות הענקיות והגשר העליון", "isNew": true, "lat": 34.9855, "lng": 135.7585, "d": "חינם. בערב המדרגות מוארות, ורואים את כל העיר.", "info": "בניין תחנת קיוטו נחנך ב-1997 והוא בניין זכוכית ענק. יש בו מדרגות ענקיות שבערב מואר בהן LED, וגשר תצפית בקומה העליונה ובו נוף על העיר. הכניסה חינם והוא קרוב לדירה.", "tip": "הגשר העליון נוח לעלייה במעלית. למעלה יש רוח, מומלץ מעיל."}]}, "sec": "kyoto", "base": {"name": "הדירה בקיוטו (Sanjō-Shirakawa)", "lat": 35.00998, "lng": 135.77869}, "about": "אראשייאמה: יער הבמבוק ב-07:45, Tenryū-ji ו-Ōkōchi Sansō. ב-12:00 הרכבת הרומנטית לקמאוקה, וב-14:00 השייט ב-Hozugawa בחזרה לאראשייאמה. שניהם הוזמנו.", "dec": "הוזמנו: הרכבת הרומנטית ב-12:00 והשייט ב-14:00 (144$). לכן היום הזה הוחלף עם 16/11.", "note": "<b>⏰ השייט ב-14:00 והרכבת ב-12:00, שניהם הוזמנו.<\/b> אחרי השייט (כ-16:00) נשאר כ-40 דק׳ אור יום לגשר ולרחוב הראשי, אז לא לתכנן שם יותר מזה.", "intro": "אראשייאמה, בקצה המערבי של קיוטו, היא האזור המפורסם בעיר ליער הבמבוק ולנוף ההר והנהר. ביום הזה שני דברים שהוזמנו: רכבת רומנטית בעמק Hozugawa ושייט בחזרה. אם מגיעים מוקדם, מתחילים בשקט של הבמבוק.", "tips": ["בעונת השלכת אראשייאמה צפופה מאוד אחרי 09:00. היער צריך להיות הדבר הראשון.", "הרכבת הרומנטית ב-12:00 והשייט ב-14:00 כבר מוזמנים. לא לשנות שעות, ולהגיע לתחנות קצת לפני.", "השייט בנהר פתוח ואוויר קר. מביאים שכבה חמה, כובע וכפפות קלות.", "אחרי השייט, בסביבות 16:00, נשאר כ-40 דקות אור, ולכן לא מתכננים יותר מהגשר והרחוב הראשי.", "כדאי להחזיק מעט ין במזומן: בחלק מהמקדשים והדוכנים לא מקבלים כרטיס."]}, {"id": "d1811", "region": "קיוטו", "date": "רביעי 18/11", "theme": "טיול יום: מיאג׳ימה והירושימה", "color": "#ff6b6b", "status": "booked", "daytrip": true, "ride": "🚄 3:20 שעות + 🚆 ומעבורת 1:30 שעות", "walk": "כ-8 ק״מ", "stops": [{"t": "07:00", "name": "🚄 שינקנסן Nozomi להירושימה (1:40 שעות), JR ל-Miyajimaguchi (30 דק׳), ו-⛴️ מעבורת JR, שעוברת ליד השער (10 דק׳)", "move": true, "book": true, "bk": "todo", "todo": "לא צריך מראש. אם קונים פס Kansai-Hiroshima, לא מזמינים Nozomi (ראו rail-pass.html)."}, {"t": "09:45", "name": "Itsukushima Jinja ושער הטורי הצף", "type": "must", "lat": 34.2959, "lng": 132.3198, "d": "לבדוק את טבלת הגאות: במים גבוהים השער \"צף\", ובמים נמוכים אפשר ללכת אליו.", "info": "Itsukushima Jinja הוא מקדש שינטו שבנוי על כלונסאות בקצה הים, כך שבזמן גאות נראה כמו שהוא צף. המסורת מייחסת את הקמתו לשנת 593, והמבנים הנוכחיים מתקופת שליטתו של Taira no Kiyomori במאה ה-12. שער הטורי האדום שלו, בגובה כ-16 מטר, עומד בים והוא אחד הסמלים המוכרים ביותר של יפן. המקום חלק ממורשת עולמית. מהמעברים המוגבהים של המקדש אפשר לראות את השער מקרוב.", "tip": "נקודת הצילום הקלאסית היא מהחוף, מולו. בשפל יורדים לחול ומתקרבים לשער, ובגאות נהנים מהצפה."}, {"t": "10:45", "name": "רחוב Omotesandō של האי", "type": "opt", "lat": 34.298, "lng": 132.321, "info": "Omotesandō הוא הרחוב הראשי המסחרי של האי, והוא ממוקם קרוב לנמל. יש בו חנויות מזכרות, חטיפים ומאפים. המוכר ביותר הוא momiji manju, עוגייה בצורת עלה מייפל, והאיילים מסתובבים גם כאן.", "tip": "כל מאפה וחטיף: לבדוק כשרות לפני שקונים. לשמור על הציוד מהאיילים."}, {"t": "11:15", "name": "Daishō-in", "type": "opt", "lat": 34.2925, "lng": 132.319, "info": "Daishō-in הוא מקדש בודהיסטי מזרם Shingon, בתחתית הר Misen, והוא אחד המקדשים החשובים באי. יש בו מדרגות ועליהן גלגלי תפילה, פסלים רבים ואולמות על מדרון. אווירתו שקטה יותר מאווירת המקדש הגדול בחוף.", "tip": "הולכים בנחת בין האולמות ולא ממהרים. כדאי להסתכל גם על הפסלים הקטנים לאורך השבילים."}, {"t": "13:15", "name": "⛴️ מעבורת, 🚆 JR ו-🚋 חשמלית לפארק השלום (כשעה)", "move": true}, {"t": "14:30", "name": "כיפת האטום ואנדרטת הילדים", "type": "must", "lat": 34.3955, "lng": 132.4536, "info": "כיפת האטום (Genbaku Dome) היא שריד של בניין שהיה מרכז לקידום תעשייה במחוז. ב-6 באוגוסט 1945 הוא עמד קרוב מאוד לנקודת הפיצוץ, ושרד חלקית. הוא נשמר כפי שהוא כזיכרון, וחלק ממורשת עולמית. בפארק הזיכרון שלידו גם האנדרטה לילדים, שמוקדשת לזכר Sadako Sasaki ולילדים שנפגעו, ואליה נשלחים עגורי נייר מכל העולם.", "tip": "מסתכלים על הכיפה מכמה כיוונים. האנדרטה שקטה, ולא מרעישים שם."}, {"t": "15:15", "name": "מוזיאון השלום", "type": "must", "book": true, "lat": 34.3915, "lng": 132.452, "d": "", "info": "מוזיאון השלום של הירושימה מציג את סיפור הפצצה האטומית: חפצים אישיים, תמונות, ועדויות של ניצולים. הביקור מרגש וקשה, ולכן כדאי לקבוע זמן לפניו ואחריו. המוזיאון מתאים למבוגרים. בדרך כלל לוקח לפחות שעה וחצי. לפי התכנון מזמינים כרטיס מראש.", "bk": "todo", "todo": "כניסה עם שעה. ראית שיש מקום, אבל עדיף להזמין לפני היום.", "tip": "מומלץ להשתמש במדריך שמע או בתרגום, ולבדוק מראש אם חלק מהאולמות סגורים לשיפוץ."}, {"t": "17:00", "name": "מגדל Orizuru: תצפית", "type": "opt", "lat": 34.396, "lng": 132.455, "d": "ליד הכיפה.", "info": "Orizuru Tower הוא מבנה עם מרפסת תצפית על הגג, ממש ליד כיפת האטום. אפשר לראות את העיר מלמעלה ולהבין את הגאוגרפיה. יש גם פעילות של עגורי נייר שזורקים דרך חור בקיר מיוחד. זה מקום נוח לסיים בו את הביקור.", "tip": "זו אפשרות אם נשאר זמן ואור. הנוף בשקיעה יפה."}, {"t": "או", "name": "גן Shukkei-en", "type": "opt", "lat": 34.4005, "lng": 132.4675, "d": "נסגר ב-17:00, אז רק אם מסיימים מוקדם.", "info": "Shukkei-en הוא גן שהוקם ב-1620 עבור Asano Nagaakira. שמו פירושו 'נוף מכווץ': בגן קטן מצוירים בהקטנה הרים, נהרות ואגם. אחרי ההפצצה שוחזר הגן. הוא שקט וקל להליכה.", "tip": "לפי המידע שיש לנו נסגר ב-17:00, אז רק אם מסיימים מוקדם. לבדוק שעת סגירה."}], "eve": {"t": "18:00", "opts": [{"name": "🚄 חזרה לקיוטו (כ-1:40 שעות)", "lat": 34.3977, "lng": 132.4753, "d": "הרגיל.", "info": "חוזרים לקיוטו בשינקנסן, כ-1:40 שעות בקירוב. כדאי לבדוק מראש את שעת הרכבת האחרונה הנוחה ולהגיע לתחנה בנחת.", "tip": "אחרי יום ארוך מומלץ לקנות מים ופירות לפני הרכבת. לבדוק כשרות לכל חטיף ארוז."}]}, "sec": "kyoto", "base": {"name": "הדירה בקיוטו (Sanjō-Shirakawa)", "lat": 35.00998, "lng": 135.77869}, "about": "טיול יום בשינקנסן: שער הטורי הצף במיאג׳ימה בבוקר, והירושימה ומוזיאון השלום אחר הצהריים.", "dec": "בלי רכבל Misen.", "intro": "טיול יום בשינקנסן לשני מקומות שונים מאוד. בבוקר מיאג׳ימה, אי קטן עם מקדש שנראה כמו שצף על המים. אחר הצהריים הירושימה, עם אתרי הזיכרון של הפצצה האטומית.", "tips": ["לתכנן את היום לפי טבלת הגאות והשפל של מיאג׳ימה (לבדוק לפני). במים גבוהים השער נראה צף, ובמים נמוכים אפשר ללכת אליו ברגל.", "מהתחנה Miyajimaguchi מפליגים בעבורת כ-10 דקות. ייתכן שיש תשלום קטן כניסה לאי או לעבורה: לבדוק לפני.", "בלי הרכבל של Misen. אם רוצים נוף, מספיק הקרבה למקדש ולשבילים בתחתית ההר.", "לשמור זמן נינוח במוזיאון השלום, ולא למהר. אחריו מקום לשבת בשקט ליד הנהר.", "שקיעה סביב 16:45, אז לא משאירים את אתרי הירושימה לשעה מאוחרת. כדי להימנע מדחק, לא לתכנן חזרה בשעה האחרונה לרכבת."]}, {"id": "d1911", "region": "קיוטו", "date": "חמישי 19/11", "theme": "המזרח: פושימי, טופוקו-ג׳י, קיומיזו וגיון", "color": "#5aa9ff", "status": "booked", "ride": "🚆 40 דק׳", "walk": "כ-11 ק״מ", "stops": [{"t": "06:45", "name": "🚆 לפושימי אינארי (20 דק׳)", "move": true}, {"t": "07:00", "name": "Fushimi Inari: השערים הכתומים עד Yotsutsuji", "type": "must", "lat": 34.96769, "lng": 135.77919, "d": "כשעה וחצי, מגיעים עד הצומת עם התצפית.", "info": "Fushimi Inari Taisha הוא המקדש הראשי של האל Inari, אל האורז והמסחר, והוא נוסד בשנת 711. אלפי שערי טורי אדומים-כתומים (senbon torii) בונים מנהרה לאורך שביל על הר Inari, וכל שער נתרם בידי אדם או עסק. השועלים בכניסות הם שליחי האל. מטפסים עד Yotsutsuji, נקודה עם נוף על קיוטו, ושם יש בדרך כלל פחות אנשים. ההליכה כולה כשעה וחצי.", "tip": "השערים הצפופים ביותר נמצאים בתחילת השביל, והאנשים נעלמים מהר אחרי הקטע הראשון. אפשר לחזור אחורה בכל נקודה."}, {"t": "09:00", "name": "Tōfuku-ji: גשר Tsūtenkyō מעל 2,000 מייפלים", "type": "must", "lat": 34.9765, "lng": 135.7738, "d": "מקדש השלכת מספר 1 בקיוטו. בשבוע הזה הוא מפוצץ, אז מגיעים בפתיחה.", "info": "Tōfuku-ji הוא מקדש זן גדול שנוסד ב-1236. גשר העץ Tsūtenkyō עובר מעל עמק ובו כ-2,000 עצי מייפל, ובעונת השלכת הצבעים בולטים מאוד. זהו אחד המקומות המפורסמים ביותר בקיוטו לצבעי סתיו, ולכן עמוס. יש בו גם גן זן מודרני עם דגמי אבן ואזוב.", "tip": "הגשר צר, והעמידה בו מוגבלת. להגיע בפתיחה ולהתייחס לתור כחלק מהחוויה."}, {"t": "10:30", "name": "Sanjūsangen-dō: 1,001 פסלים", "type": "must", "lat": 34.98788, "lng": 135.77171, "info": "Sanjūsangen-dō הוא אולם עץ ארוך, באורך של כ-120 מטר. בתוכו עומדים 1,001 פסלי Kannon מוזהבים, ובאמצע פסל גדול של Kannon עם אלף ידיים. הפסלים עשויים עץ מהמאה ה-12 וה-13, ולכל אחד מהם פנים שונות. האולם מרשים בגודלו ובסדר שלו.", "tip": "אסור לצלם בפנים, וצריך להסיר נעליים. שומרים על שקט."}, {"t": "12:00", "name": "🚕 לקיומיזו", "move": true}, {"t": "12:30", "name": "Kiyomizu-dera: המרפסת על הצוק", "type": "must", "lat": 34.99467, "lng": 135.78466, "info": "Kiyomizu-dera הוא מקדש בודהיסטי שמיוחס לשנת 778. הבמה הגדולה שלו נבנתה מעץ ללא מסמרים, והיא תלויה מעל הצוק עם נוף על העיר. מכאן הביטוי 'לקפוץ מהבמה של Kiyomizu', שמשמעותו לקבל החלטה אמיצה. למטה זורם מפל Otowa, ששלושת הזרמים שלו מסמלים אריכות ימים, לימודים ואהבה. המקום חלק ממורשת עולמית.", "tip": "הנוף הכי טוב מהבמה, אבל עמוס שם. את הבמה עצמה רואים היטב מנקודה בצד, במורד השביל."}, {"t": "13:30", "name": "Sannenzaka ו-Ninenzaka", "type": "must", "lat": 34.99666, "lng": 135.78101, "info": "Sannenzaka ו-Ninenzaka הם שני רחובות מדורגים וצרים שמובילים מ-Kiyomizu אל גיון. בתים מעץ בסגנון ישן, חנויות ובתי תה מסדרים את הרחוב. לפי האמונה, מי שמועד ב-Sannenzaka צפוי לשלוש שנים של מזל רע, ולכן הולכים בזהירות.", "tip": "המדרגות מבריקות לפעמים. נעליים עם אחיזה. כל ממתק או חטיף: לבדוק כשרות."}, {"t": "14:00", "name": "סדנת ציור על Kiyomizu-yaki", "type": "opt", "isNew": true, "book": true, "lat": 34.9955, "lng": 135.783, "d": "המלאכה של קיוטו. הכלי נשלח אחרי שריפה בתנור, אז לבדוק שהם שולחים לחו״ל.", "info": "Kiyomizu-yaki היא קרמיקה מקומית של קיוטו, והסדנה מאפשרת לצייר על צלחת או כוס. הכלי נשרף בתנור אחרי הציור, ולכן צריך לבדוק אם מקבלים אותו מיד או שהוא נשלח אחר כך. זו אפשרות למזכרת אישית.", "bk": "todo", "todo": "אופציונלי. לבדוק שהם שולחים לחו״ל.", "tip": "לפני שמזמינים: לברר אם שולחים לחו״ל, אחרת זה לא שווה את הזמן. לוקח זמן, ואפשר לוותר על זה אם צפוף."}, {"t": "15:15", "name": "Yasaka Jinja ו-Hanamikōji בגיון", "type": "must", "lat": 35.0036, "lng": 135.7786, "info": "Yasaka Jinja הוא המקדש הגדול של רובע גיון, ובו נחגג פסטיבל Gion Matsuri בחודש יולי. שער המקדש פתוח לרחוב Shijō. Hanamikōji הוא הרחוב הראשי של הרובע, עם בתי תה מסורתיים. בשעות הערב אפשר לפעמים לראות גיישות ומאיקו בדרכן לפגישות.", "tip": "אם רואים גיישה, לא עוצרים אותה ולא מצלמים מקרוב. הרחוב צר ובעל כללים."}, {"t": "16:00", "name": "🔪 סדנת סכינים: הזוג הראשון", "type": "must", "book": true, "split": true, "lat": 35.001, "lng": 135.7745, "info": "סדנת סכינים שהוזמנה ל-16:00 עבור שני אנשים, בכתובת Yasaka Koji South, 71-13 Tamamizu-chō, Higashiyama-ku. מכינים או משחיזים סכין יפני מסורתי בהדרכת אומן. קיוטו ידועה כבר מאות שנים בעבודות מתכת וסכינים. אורך הסדנה לא ידוע, כנראה כשעה, ומיקום על המפה הוא קירוב.", "d": "<b>הוזמן:<\/b> 2 כרטיסים ל-16:00. Yasaka Koji South, 71-13 Tamamizu-chō, Higashiyama-ku. <b>אורך הסדנה לא ידוע לי<\/b>, כנראה כשעה. מקום על המפה מקורב.", "bk": "done", "tip": "מגיעים 10 דקות לפני. הכתובת היא הקובעת. הסכין חוזר רק במזוודה הגדולה."}, {"t": "16:00", "name": "הזוג השני בינתיים: Kennin-ji, תקרת שני הדרקונים", "type": "opt", "isNew": true, "lat": 35.0005, "lng": 135.7735, "info": "Kennin-ji הוא מקדש הזן הוותיק ביותר בקיוטו, והוא הוקם ב-1202 בידי הנזיר Eisai, שמזוהה גם עם הבאת תה מסין ליפן. על תקרת אולם ההוראה מצוירים שני דרקונים ענקיים, יצירה משנת 2002. בגן יש מקומות שקטים לישיבה. הוא מרוחק מההמון של Kiyomizu.", "d": "5 דק׳ הליכה מהסדנה. סוגר בסביבות 17:00 (לבדוק), אז מתחילים בו. אחר כך הולכים לסדנה.", "split": true}, {"t": "17:00", "name": "🔪 סדנת סכינים: הזוג השני", "type": "must", "book": true, "split": true, "lat": 35.001, "lng": 135.7745, "info": "סדנת סכינים שהוזמנה ל-17:00 עבור שני אנשים, באותו מקום: Yasaka Koji South, 71-13 Tamamizu-chō, Higashiyama-ku. מכינים או משחיזים סכין יפני מסורתי בהדרכת אומן. הסדנה נמצאת בגיון, על המסלול.", "d": "<b>הוזמן:<\/b> 2 כרטיסים ל-17:00, באותו מקום.", "bk": "done", "tip": "מגיעים 10 דקות לפני. הסכין חוזר רק במזוודה הגדולה, לא בתיק היד."}, {"t": "17:00", "name": "הזוג הראשון בינתיים: Ishibe-kōji וסמטאות Nene-no-michi בשקיעה", "type": "opt", "isNew": true, "split": true, "lat": 35.0007, "lng": 135.7808, "info": "Ishibe-kōji היא סמטה מרוצפת אבן, עם חומות עץ ובתי אירוח ישנים, בין Kōdai-ji לגיון. היא שקטה יחסית, ובערב נדלקים הפנסים. Nene-no-michi הוא השביל הסמוך. אפשר להסתובב בלי לראות המון אנשים.", "d": "10 דק׳ הליכה מהסדנה. ב-18:00 חוזרים לאסוף את הזוג השני."}, {"t": "18:00", "name": "🔀 כולם נפגשים ליד הסדנה", "move": true}], "eve": {"t": "18:15", "opts": [{"name": "Gion Corner: 7 אמנויות יפניות בשעה", "lat": 35.0015, "lng": 135.7752, "d": "המופע של 18:00 מתנגש עם הסדנה. אם רוצים, לבדוק אם יש מופע מאוחר יותר (בדרך כלל יש ב-19:00, לא אימתתי).", "info": "Gion Corner הוא מופע של כשעה שמציג כמה אמנויות מסורתיות, כמו טקס התה, נגינת kōto וקומדיה קלאסית. הוא נותן טעימה קצרה לכל מי שרוצה להכיר. המופע של 18:00 מתנגש עם הסדנה, ובדרך כלל יש מופע נוסף מאוחר יותר, אך לא אימתנו.", "tip": "לבדוק לפני מועדי המופעים ולהזמין. לא חייבים, ואפשר לבחור ב-Kōdai-ji."}, {"name": "Kōdai-ji: תאורת ערב והשתקפות במים", "isNew": true, "lat": 35.0006, "lng": 135.7811, "d": "10 דק׳ הליכה מהסדנה. אחת התאורות היפות בקיוטו. לבדוק תאריכים.", "info": "Kōdai-ji הוא מקדש שנוסד ב-1606 בידי Nene, אשתו של Toyotomi Hideyoshi, לזכרו. בעונת השלכת הגן מואר בערב, והמייפלים משתקפים בבריכה. יש גם שביל בין במבוק וגן סלעים. אחת התאורות היפות בקיוטו.", "tip": "לבדוק תאריכים ושעות, ולקנות כרטיס בכניסה. אחרי הסדנה זה 10 דקות הליכה."}]}, "sec": "kyoto", "base": {"name": "הדירה בקיוטו (Sanjō-Shirakawa)", "lat": 35.00998, "lng": 135.77869}, "about": "יום הליכה במזרח קיוטו: Fushimi Inari ב-07:00, Tōfuku-ji, Sanjūsangen-dō, Kiyomizu וגיון. אחר הצהריים סדנת הסכינים שהוזמנה, בשני זוגות: 16:00 ו-17:00. בערב Kōdai-ji המואר או Gion Corner.", "dec": "הוזמנה סדנת סכינים בגיון: 2 ב-16:00 ו-2 ב-17:00. Gion Corner או Kōdai-ji: מחליטים שם.", "note": "<b>🔪 הסכינים:<\/b> בחזרה הביתה רק במזוודה הגדולה, לא בתיק היד. זה נכון גם לסכינים מנאקמיסה (30/10).", "intro": "יום הליכה גדול במזרח קיוטו, מהשערים הכתומים של Fushimi Inari ועד הרחוב של גיון. בדרך עוברים בכמה מהמקדשים המפורסמים של העיר בשיא עונת השלכת. אחר הצהריים מתקיימת סדנת הסכינים שהוזמנה.", "tips": ["Fushimi Inari נוח לפתוח בשעה מוקדמת, כשיש מעט אנשים. המקדש עצמו פתוח כל הלילה.", "Tōfuku-ji בשבוע הזה עמוס מאוד. מגיעים בפתיחה, ולבדוק שעות וכרטיס לגשר Tsūtenkyō.", "סדנת הסכינים בגיון: 16:00 לזוג אחד ו-17:00 לזוג השני. בחזרה הביתה הסכינים רק במזוודה הגדולה, לא בתיק היד.", "נעליים נוחות: יש הרבה מדרגות ושבילים עולים, בפרט ב-Fushimi Inari וב-Kiyomizu.", "בגיון לא עוצרים גיישות בדרך לצילום ולא נכנסים לסמטאות פרטיות. יש שם הנחיות ושלטים."]}, {"id": "d2011", "region": "קיוטו", "date": "שישי 20/11", "theme": "מרכז קיוטו: הארמון, Nishiki, ובישולים", "color": "#ff6b9d", "status": "fri", "ride": "🚇 20 דק׳", "walk": "כ-6 ק״מ", "stops": [{"t": "08:00", "name": "Shimogamo Jinja ויער Tadasu no Mori", "type": "opt", "isNew": true, "lat": 35.039, "lng": 135.7727, "d": "יער קדום בתוך העיר. חינם.", "info": "Shimogamo Jinja הוא אחד המקדשים העתיקים בקיוטו, וחלק ממורשת עולמית. לצדו יער Tadasu no Mori, יער קדום שנשמר בלב העיר, ובו עצים גבוהים ושביל קצר ומוצל. הכניסה למקדש ויער הם חינם. האווירה בבוקר שקטה, גם אם הוא בתוך העיר.", "tip": "מגיעים מוקדם בבוקר, וממשיכים רגלית אל הארמון."}, {"t": "או", "name": "Uji: Byōdō-in (המקדש שעל המטבע של 10 ין) ורחוב התה", "type": "opt", "lat": 34.8893, "lng": 135.8077, "d": "במקום Shimogamo והארמון: יוצאים ב-07:45 ב-JR (30 דק׳), וב-11:00 חוזרים ל-Nishiki. היה אצלכם \"אולי\". עבר לכאן מ-17/11, כי עכשיו מותר להתחייב בשישי עד 12:00.", "info": "Byōdō-in בעיר Uji הוא מקדש שנבנה ב-1053, ואולם Phoenix Hall שלו מופיע על מטבע 10 ין. הבניין סימטרי ומשתקף בבריכה, ומעל הגג שני פסלי עוף. Uji ידועה בתה מאות שנים: ברחוב המוביל למקדש יש חנויות מאצ׳ה וממתקים. הנסיעה ב-JR אורכת כחצי שעה לפי התכנון.", "tip": "ממתקי מאצ׳ה וגלידה: לבדוק כשרות. יוצאים ב-07:45 כדי לחזור ל-Nishiki ב-11:00. זו חלופה לארמון ול-Shimogamo."}, {"t": "09:00", "name": "ארמון הקיסר בקיוטו", "type": "must", "lat": 35.0254, "lng": 135.7621, "d": "בלי הזמנה ובחינם. סגור רק בימי שני.", "info": "ארמון הקיסר בקיוטו שימש כבית של קיסרי יפן עד 1869, כשהבירה עברה לטוקיו. הוא נמצא בפארק גדול, Kyoto Gyoen. הכניסה חינם, ובדרך כלל אפשר להיכנס ללא הזמנה מראש. רואים אולמות, חצרות וגנים. יש סיורים מודרכים, ולעיתים נדרשת הרשמה או דרכון.", "tip": "להביא דרכון. סגור בימי שני, ושעות והגבלות משתנות, ולכן לבדוק לפני."}, {"t": "10:30", "name": "שוק Nishiki וארקייד Teramachi: קניות לשבת", "type": "must", "lat": 35.005, "lng": 135.765, "info": "Nishiki Market הוא שוק מקורה צר באורך של כמה מאות מטרים, שפועל כבר כ-400 שנה ונקרא 'המטבח של קיוטו'. מוכרים בו תבלינים, ירקות כבושים, טופו, דגים וממתקים. Teramachi הוא ארקייד קניות סמוך, ובו חנויות רבות. הוא נוח לקניות לקראת שבת.", "tip": "מגיעים לפני שהשוק מתמלא. קונים ירקות, פירות וחומרי גלם, ובודקים כשרות לכל מוצר ארוז. לא אוכלים בהליכה."}, {"t": "12:00", "name": "🚇 קו Tōzai ל-Higashiyama, ומשם הביתה לבשל. כניסת שבת בסביבות 16:25 (לבדוק)", "move": true}], "note": "<b>אפשר להתחייב עד 12:00.<\/b> Uji או הארמון: מחליטים שם. ארוחת שבת בחב״ד: סגור.", "sec": "kyoto", "base": {"name": "הדירה בקיוטו (Sanjō-Shirakawa)", "lat": 35.00998, "lng": 135.77869}, "about": "שישי: ארמון הקיסר (או Uji במקומו), ו-Nishiki לקניות לשבת. בבית ב-12:30.", "dec": "Uji או הארמון: מחליטים שם. חב״ד סגור.", "intro": "יום שישי בקיוטו, עם התחייבויות עד 12:00 בלבד כדי לחזור הביתה ולהכין את השבת. בבוקר ארמון הקיסר או Uji, ובסוף שוק Nishiki לקניות לשבת. היום רגוע יותר מהימים הקודמים.", "tips": ["לחזור הביתה עד 12:30 ולהספיק לבשל. מה שלא נקנה בשוק עד 11:00, עדיף לוותר עליו.", "בקניות בשוק Nishiki: ירקות, פירות וחומרי גלם טריים הם הבחירה הבטוחה. מוצרים ארוזים ומוכנים: לבדוק כשרות.", "הארמון סגור בימי שני ופתוח אחרת. לבדוק מראש שעות ושינויים לפני.", "לפני שבת: להדפיס את אישור הסומו של מחר ולהכין מה שצריך, כדי שלא להיות תלויים בטלפון.", "ב-Nishiki לא אוכלים בהליכה בין הדוכנים, וזו נחשבת התנהגות לא מנומסת. ההמון בשוק הוא גדול אחרי 11:00."]}, {"id": "d2111", "region": "קיוטו", "date": "שבת 21/11", "theme": "שבת: שביל הפילוסוף ונאנזן-ג׳י", "color": "#3ecf8e", "status": "shabbat", "ride": "—", "walk": "כ-10 ק״מ, ועוד כ-3 אם הולכים ל-Eikandō", "stops": [{"t": "08:30", "name": "Heian Jingū: השטח החיצוני והשער הענק", "type": "must", "lat": 35.016, "lng": 135.7823, "d": "חינם. 10 דק׳ מהדירה.", "info": "Heian Jingū הוא מקדש שינטו שנבנה ב-1895 לציון 1,100 שנה להקמת קיוטו כבירה. המבנים הם העתק מוקטן של הארמון הקיסרי הישן, וצבעם אדום-כתום. בכניסה עומד שער טורי אדום ענק. הגנים מאחור יפים, אבל הם בתשלום, ולכן בשבת נשארים בשטח החיצוני החינמי. הוא קרוב לדירה.", "tip": "השער הענק מצולם בקלות מהצד הנגדי של הכביש. אין צורך להיכנס פנימה."}, {"t": "09:15", "name": "תעלת Okazaki", "type": "opt", "lat": 35.012, "lng": 135.785, "info": "תעלת Okazaki היא חלק מתעלת Lake Biwa, שנחפרה ב-1890 כדי להעביר מים מאגם Biwa לקיוטו. לאורכה שבילים רגועים, עצים ופארקים. מאחרי Heian Jingū היא עוברת אל Nanzen-ji.", "tip": "זו הליכה קצרה ונעימה בדרך. בסתיו העצים לאורך התעלה משנים צבע."}, {"t": "09:45", "name": "Nanzen-ji ואמת המים Suirokaku", "type": "must", "lat": 35.011, "lng": 135.794, "d": "המתחם החיצוני חינם.", "info": "Nanzen-ji הוא מקדש זן גדול שנוסד ב-1291, ובמקור שימש וילה של הקיסר Kameyama. אמת המים Suirokaku היא מבנה מימי Meiji, מלבנים, שעדיין מובילה מים כחלק מהתעלה. הקשתות שלה מקום מצולם מאוד. המתחם החיצוני חינם. בשבת לא נכנסים לחלקים בתשלום.", "tip": "מצלמים את הקשתות מכמה זוויות, ואפשר לעלות על השביל שלצדן."}, {"t": "11:00", "name": "שביל הפילוסוף, צפונה", "type": "must", "lat": 35.023, "lng": 135.7945, "d": "כ-2 ק״מ לאורך תעלה.", "info": "שביל הפילוסוף (Tetsugaku-no-michi) הוא שביל של כ-2 ק״מ לאורך תעלה, והוא קרוי על שם הפילוסוף Nishida Kitarō שנהג ללכת בו. עצים משני צדי השביל, ובדרך קפה ובוטיקים קטנים. בסתיו הצבעים יפים. השביל נגמר ליד Ginkaku-ji.", "tip": "בשבת מסתפקים בשביל עצמו ולא נכנסים ל-Ginkaku-ji בתשלום. כל אוכל או ממתק: לבדוק כשרות."}, {"t": "12:00", "name": "Hōnen-in: שער הטחב", "type": "opt", "isNew": true, "lat": 35.0226, "lng": 135.7975, "d": "חינם.", "info": "Hōnen-in הוא מקדש קטן ושקט עם גג קש וגן אזוב. שער הקש נראה כמו כניסה לעולם אחר. הכניסה לשטח חינם, ובדרך כלל כמעט ריק. הוא נמצא קרוב לשביל הפילוסוף.", "tip": "השביל הפנימי בין הגדרות והאזוב עדין. עוברים לאט ובשקט."}, {"t": "13:00", "name": "🚶 הביתה (30 דק׳), ארוחת שבת ומנוחה", "move": true}, {"t": "15:30", "name": "🚶 יוצאים ברגל למופע, כ-20 דק׳ מהדירה", "move": true, "d": "להגיע לפני 16:00 בכמה דקות. מומלץ לוודא כמה זמן לפני ההתחלה צריך להיות שם."}, {"t": "16:00", "name": "🥋 Kyoto Sumo Show: חוויה, צילום ושתי שתיות", "type": "must", "book": true, "lat": 35.0045, "lng": 135.7688, "d": "<b>הוזמן ושולם, 4 מבוגרים: 165 ₪ בסך הכל.<\/b> Teramachi MEGAPOWER Bldg., 3F, 302 Higashidaimonjicho, Nakagyo-ku. 2 דק׳ מתחנת Kawaramachi. כ-90 דק׳, מסתיים בסביבות 17:30. מקום על המפה מקורב, הכתובת היא הקובעת.", "info": "Kyoto Sumo Show הוא מופע של סומו, ובו מתאבקים מציגים טקסים שינטואיסטיים, אימונים והסברים על כללי המשחק. יש חלק של חוויה, שבו מנסים את התנוחות בעצמכם. הוזמן ושולם עבור 4 מבוגרים: 165 ₪ בסך הכל. הכתובת: Teramachi MEGAPOWER Bldg., 3F, 302 Higashidaimonjicho, Nakagyo-ku, כ-2 דקות מתחנת Kawaramachi. נמשך כ-90 דקות ומסתיים בסביבות 17:30.", "bk": "done", "tip": "הכתובת היא הקובעת, כי המיקום במפה מקורב. להגיע ברגל בזמן, ולהצטייד באישור מודפס."}, {"t": "17:30", "name": "🚶 יוצאים מהמופע, בערך בצאת השבת", "move": true, "d": "צאת השבת בקיוטו כנראה בסביבות 17:30. <b>לבדוק בלוח.<\/b>"}], "eve": {"t": "17:30", "opts": [{"name": "Eikandō: תאורת הלילה של השלכת", "lat": 35.0147, "lng": 135.7946, "d": "כ-3 ק״מ ק Kumano Kodō. מהנקודה Fushiogami רואים את שער הטורי הענק מעבר לעמק, במקום שבו עולי הרגל קדו קדימה לראשונה. שביל נינוח באמצע יער, בלי טיפוס קשה.", "tip": "להתחשב שהאבנים רטובות אחרי גשם."}, {"t": "10:15", "name": "🚗 לדורוקיו (35 דק׳)", "move": true}, {"t": "11:00", "name": "שייט בערוץ Dorokyō", "type": "must", "book": true, "lat": 33.89264, "lng": 135.88548, "d": "הוזמן ל-11:00. כ-40 דק׳, מסתיים בערך ב-11:45.", "info": "Dorokyō הוא עמק צר של נהר Kitayama, בין צוקים של עשרות מטרים. שטים בסירת כפר מסורתית (kawabune) בין סלעים ירוקים ומים צלולים. השייט נמשך כ-40 דקות. בסתיו הצוקים צבעוניים. השייט הוזמן ל-11:00.", "bk": "done", "tip": "להגיע 15 דקות לפני, ולשים כובע וכפפות. על הסירה קר מהרוח."}, {"t": "11:45", "name": "🚗 לגשר Tanize, דרך הונגו וכביש 168 (כ-1:45 שעות)", "move": true, "d": "<b>הערכה שלי, לא נבדקה ב-Maps.<\/b> הגשר ב-Totsukawa שבמחוז Nara, צפונית להונגו. לאמת את זמן הנסיעה לפני שמחליטים."}, {"t": "13:30", "name": "גשר Tanize התלוי (Tanize Suspension Bridge)", "type": "opt", "isNew": true, "lat": 34.10139, "lng": 135.76278, "d": "גשר הולכי רגל תלוי גבוה מעל נהר Totsukawa. כ-30–40 דק׳. <b>חייבים לצאת משם עד 14:00<\/b> כדי להגיע ל-Urashima עד 17:00 (כ-2:45 שעות נסיעה, הערכה). אם מתעכבים, מוותרים.", "info": "גשר הולכי רגל תלוי גבוה מעל העמק במחוז Nara, בלב הרי Kii. הליכה על הגשר נותנת תחושת גובה ונוף על העמק הירוק. זו עצירה אופציונלית, ורק אם הזמן מתאים. כדאי לבדוק לפני תנאי הדרך ופתיחת הגשר."}, {"t": "14:00", "name": "🚗 ל-Nachikatsuura ול-Hotel Urashima (כ-2:45 שעות)", "move": true}, {"t": "או", "name": "בלי הגשר: Kumano Hayatama Taisha בשינגו", "type": "opt", "lat": 33.73223, "lng": 135.98351, "d": "בדרך לחוף. אם מוותרים על Tanize, מגיעים ל-Urashima כבר ב-14:00–15:00.", "info": "Hayatama Taisha בשינגו הוא אחד משלושת המקדשים הגדולים של Kumano. הוא על שפך הנהר, אדום וססגוני. בחצר עץ Nagi שאומרים שהוא בן כאלף שנה.", "tip": "עצירה קצרה בדרך לחוף, כ-30 דקות."}, {"t": "או", "name": "בלי הגשר: מגדל התצפית התת-ימי Katsuura Kaichu Tenbo-tō", "type": "opt", "isNew": true, "lat": 33.62535, "lng": 135.95096, "d": "חלונות מתחת לפני הים, בקצוארה ליד המלון. <b>שעות לא נבדקו, לבדוק.<\/b> מקום על המפה מקורב.", "info": "מגדל תצפית שיורד מתחת לפני הים, עם חלונות שדרכם רואים דגים וחיי ים. נמצא בקצוארה, ליד המלון. שעות הפתיחה לא נבדקו, ולכן לבדוק לפני.", "tip": "אפשרות טובה אם מגיעים מוקדם ונשארה שעה."}, {"t": "16:30", "name": "⛴️ סירת השאטל ל-Hotel Urashima. צ׳ק-אין 15:00, אפשר עד 17:00", "type": "must", "book": true, "lat": 33.62535, "lng": 135.95096, "d": "לבדוק עם המלון מה השאטל האחרון, אם מגיעים מאוחר.", "bk": "done", "info": "מגיעים למלון בסירת שאטל, כי Hotel Urashima שוכן על חצי אי. צ׳ק-אין מ-15:00. אפשר להגיע עד 17:00."}], "eve": {"t": "17:15", "opts": [{"name": "Bōkidō: אונסן במערה הפונה לים", "lat": 33.62535, "lng": 135.95096, "info": "Bōkidō הוא אונסן במערה טבעית שפתוחה לאוקיינוס. טובלים במים חמים כשהגלים מתנפצים כמה מטרים מכם. זה אחד האונסנים המפורסמים ביפן.", "tip": "לבדוק שעות פתיחה והפרדה בין גברים לנשים. ללא בגד ים, ולהביא מגבת קטנה."}, {"name": "Genbu-dō ואונסן הגג של המלון", "lat": 33.626, "lng": 135.9515, "d": "אותו מלון, מקום אחר.", "info": "Genbu-dō ואונסן הגג הם אונסנים נוספים באותו מלון, עם מים חמים ונוף. הפרטים והשעות לפי המלון.", "tip": "לשאול בקבלה על שעות נפרדות לגברים ולנשים."}]}, "sec": "kii", "base": {"name": "Hotel Urashima", "lat": 33.62535, "lng": 135.95096}, "about": "החג בקומאנו: Tsuboyu ב-06:00 ושייט Dorokyō (הוזמן, 11:00). אחרי השייט, גשר Tanize התלוי (אופציונלי). מגיעים ל-Hotel Urashima בין 15:00 ל-17:00. מפל נאצ׳י ירד מהיום הזה ועבר למחר.", "dec": "מפל נאצ׳י ו-Daimon-zaka עברו ל-24/11. מקדשי Hongū ו-Hayatama הפכו לאופציונליים. נוסף גשר Tanize.", "intro": "יום החג בלב קומאנו, אזור של דרכי עלייה לרגל קדומות, יערות וחמי מעיין. מתחילים מוקדם ב-Tsuboyu, ממשיכים בשייט נינוח ב-Dorokyō, ובסוף מגיעים בסירה למלון שעל חוף Katsuura. ביום חג יהיו מבקרים רבים, ולכן ההתחלה המוקדמת חשובה.", "tips": ["לבוא ל-Tsuboyu במזומן ולקחת מספר בקופה. ביום חג להגיע לפני הזמן.", "דרכי הרי Kii צרות ומתפתלות. להשאיר מרווח של כמה שעות ביום, ולא למהר.", "לבדוק מה השאטל האחרון לסירה של Hotel Urashima, כדי שלא להיתקע.", "הנסיעה מהגשר ל-Urashima כ-2:45 שעות (הערכה). אם מתעכבים, מוותרים על Tanize."]}, {"id": "d2411", "region": "קיי", "date": "שלישי 24/11", "theme": "מפל נאצ׳י ← Kushimoto ← שירהאמה", "color": "#f5b83d", "status": "booked", "ride": "🚗 כ-3:30 שעות", "walk": "כ-3 ק״מ", "stops": [{"t": "10:00", "name": "⛴️ שאטל ליבשה, ו-🚗 למפל נאצ׳י (20 דק׳)", "move": true, "d": "הצ׳ק-אאוט ב-10:00."}, {"t": "10:30", "name": "מפל נאצ׳י והפגודה האדומה", "type": "must", "lat": 33.67534, "lng": 135.88761, "d": "המפל הגבוה ביפן, והתמונה האייקונית עם הפגודה. כ-45 דק׳ כולל ההליכה לתחתית המפל.", "info": "מפל נאצ׳י הוא המפל בעל הנפילה הרציפה הגבוהה ביותר ביפן, כ-133 מטר. לידו מקדש Seiganto-ji עם הפגודה האדומה, והשילוב ביניהם הוא התמונה האייקונית של חצי האי Kii. האזור כולו חלק מהמורשת העולמית ושייך לדרכי Kumano. המפל נחשב קדוש, ופולחן מים מתקיים בו מזה מאות שנים.", "tip": "הפגודה והמפל נראים יחד מנקודת התצפית ליד המקדש. להשאיר כ-45 דקות."}, {"t": "או", "name": "Daimon-zaka: מדרגות האבן ביער, במקום לנסוע למפל", "type": "opt", "lat": 33.666, "lng": 135.895, "d": "חונים בתחתית ועולים ברגל כ-40 דק׳. אז המפל ב-11:15, וכל הלו״ז זז בכ-45 דק׳.", "info": "Daimon-zaka הוא שביל אבן קדום עם 267 מדרגות בין ארזים בני מאות שנים, חלק מנתיב Kumano Kodō. השביל עולה לאזור מפל נאצ׳י. זו הליכה יפה ביער, שבה אפשר לצלם כאילו הזמן עצר. זו חלופה לנסיעה ישירה למפל.", "tip": "אם בוחרים בזה, לוח הזמנים זז בכ-45 דקות. האבנים חלקות אחרי גשם."}, {"t": "11:30", "name": "🚗 לקושימוטו (כ-50 דק׳)", "move": true}, {"t": "12:20", "name": "Hashigui-iwa: 40 עמודי סלע בים", "type": "must", "lat": 33.48806, "lng": 135.79575, "info": "Hashigui-iwa הוא שורה של כ-40 עמודי סלע שנמשכת מהחוף אל האי. לפי האגדה, Kōbō Daishi אתגר שד לבנות גשר בין החוף לאי בתוך לילה. הגלים מתנפצים בין העמודים, והנוף פתוח לים.", "tip": "מקום מצוין לצילום בבוקר, עם אור נמוך."}, {"t": "12:50", "name": "🆕 האנדרטה והמוזיאון הטורקי, Kashinozaki", "type": "opt", "isNew": true, "lat": 33. // ---------- map ----------
const map = L.map('map').setView([35.5,137.5],6);
const google = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=en&gl=us&x={x}&y={y}&z={z}',{subdomains:'0123',attribution:'&copy; Google',maxZoom:20});
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19});
let tileErrors=0; google.on('tileerror',()=>{ if(++tileErrors===3){ map.removeLayer(google); esri.addTo(map);} });
google.addTo(map);
L.control.layers({'English (Google)':google,'Esri':esri},null,{position:'topleft'}).addTo(map);
let mapLayer = L.layerGroup().addTo(map);
let markers = {};

function drawDays(list, single){
  map.invalidateSize(); mapLayer.clearLayers(); markers={};
  const bounds=[];
  list.forEach(day=>{
    let n=0; const line=[];
    const base=day.base;
    if(!day.daytrip && base){ line.push([base.lat,base.lng]); }
    day.stops.forEach((s,i)=>{
      if(s.move || s.lat==null) return;
      n++;
      const cls = s.type==='opt'?'opt':'';
      const icon = L.divIcon({className:'',html:`<div class="num-icon ${cls}" style="background:${day.color};border-color:${day.color}">${single?n:''}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
      const m = L.marker([s.lat,s.lng],{icon}).bindPopup(`<b>${single?n+'. ':''}${s.name}</b><br><small>${day.date} · ${s.t} · ${s.type==='must'?'ליבה':'אופציונלי'}</small>${s.d?'<br><small>'+s.d+'</small>':''}`);
      mapLayer.addLayer(m); markers[day.id+'_'+i]=m; bounds.push([s.lat,s.lng]);
      if(!isAlt(s)) line.push([s.lat,s.lng]);
    });
    if(day.eve) day.eve.opts.forEach((o,j)=>{
      if(o.lat==null) return;
      const icon = L.divIcon({className:'',html:`<div class="num-icon eve">${single?'אבגדה'[j]:''}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
      const m = L.marker([o.lat,o.lng],{icon}).bindPopup(`<b>🌙 ${o.name}</b><br><small>${day.date} · ערב מ-${day.eve.t}</small>${o.d?'<br><small>'+o.d+'</small>':''}`);
      mapLayer.addLayer(m); markers[day.id+'_e'+j]=m; if(single) bounds.push([o.lat,o.lng]);
    });
    if(!day.daytrip && base){ line.push([base.lat,base.lng]); bounds.push([base.lat,base.lng]); }
    if(line.length>1) mapLayer.addLayer(L.polyline(line,{color:day.color,weight:3,opacity:.85,dashArray:'6 6'}));
  });
  const bases = {}; list.forEach(d=>{ if(d.base) bases[d.base.name]=d.base; });
  Object.values(bases).forEach(b=>mapLayer.addLayer(L.marker([b.lat,b.lng],{icon:L.divIcon({className:'home-icon',html:'🏠',iconSize:[24,24],iconAnchor:[12,12]})}).bindPopup('<b>'+b.name+'</b>')));
  if(bounds.length) map.fitBounds(bounds,{padding:[30,30],maxZoom:15});
  setTimeout(()=>map.invalidateSize(),50);
}

function drawRoute(){
  map.invalidateSize(); mapLayer.clearLayers(); markers={};
  const seen=[]; days.forEach(d=>{ if(d.base && (!seen.length || seen[seen.length-1].b.name!==d.base.name)) seen.push({b:d.base,d}); });
  const pts=[[35.7719,140.3929],...seen.map(x=>[x.b.lat,x.b.lng])];
  mapLayer.addLayer(L.polyline(pts,{color:'#5aa9ff',weight:3,opacity:.8,dashArray:'6 6'}));
  seen.forEach((x,i)=>{
    const icon=L.divIcon({className:'',html:`<div class="num-icon" style="background:${secColor[x.d.sec]}">${i+1}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
    mapLayer.addLayer(L.marker([x.b.lat,x.b.lng],{icon}).bindPopup(`<b>${i+1}. ${x.b.name}</b><br><small>מ-${x.d.date}</small>`));
  });
  mapLayer.addLayer(L.marker([35.7719,140.3929],{icon:L.divIcon({className:'home-icon',html:'✈️',iconSize:[24,24],iconAnchor:[12,12]})}).bindPopup('<b>נריטה</b>'));
  map.fitBounds(pts,{padding:[30,30]}); setTimeout(()=>map.invalidateSize(),50);
}

  <span><span class="tag split">🛍️ פיצול</span>הבנות בקניות, הבנים במשהו אחר</span></div>`; }

function stepHtml(day,s,i,counter){
  if(s.move) return `<div class="step move ${s.bk==='todo'?'todo':''}"><span class="t">${s.t}</span><span class="n">·</span><span>${s.book?(s.bk==='todo'?'<span class="tag todo">📌 עוד להזמין</span>':'<span class="tag done">✅ הוזמן</span>'):''}${s.name}${s.bk==='todo'&&s.todo?`<span class="todo-note">📌 ${s.todo}</span>`:''}${s.d?`<span class="d">${s.d}</span>`:''}</span></div>`;
  counter.n++;
  const alt = isAlt(s);
  const tags = (alt?'<span class="tag alt">או</span>':'') + `<span class="tag ${s.type}">${s.type==='must'?'ליבה':'אופציונלי'}</span>`
    + (s.isNew?'<span class="tag new">רעיון שלי</span>':'') + (s.split?'<span class="tag split">🛍️ פיצול</span>':'') + (s.book?(s.bk==='todo'?'<span class="tag todo">📌 עוד להזמין</span>':'<span class="tag done">✅ הוזמן</span>'):'');
  return `<div class="step ${s.type} ${alt?'alt':''} ${s.bk==='todo'?'todo':''}" data-i="${day.id}_${i}"><span class="t">${String(s.t).startsWith('או')?'חלופה':s.t}</span><span class="n">${counter.n}</span>
    <span>${tags}${s.name}${s.info?`<span class="info">📖 ${s.info}</span>`:''}${s.tip?`<span class="tip">💡 ${s.tip}</span>`:''}${s.bk==='todo'&&s.todo?`<span class="todo-note">📌 ${s.todo}</span>`:''}${s.d?`<span class="d">${s.d}</span>`:''}</span></div>`;
}
function decHtml(day){
  if(!day.dec) return '';
  return `<div class="qbox"><h4>✅ מה החלטתם</h4><div style="font-size:.9rem">${day.dec}</div></div>`;
}
function gmaps(day, onlyMust){
  const pts = day.stops.filter(s=>!s.move && s.lat!=null && !isAlt(s) && (!onlyMust || s.type==='must'));
  const seq = (day.daytrip||!day.base ? pts : [day.base,...pts,day.base]).slice(0,10);
  return 'https://www.google.com/maps/dir/'+seq.map(p=>`${p.lat},${p.lng}`).join('/');
}
function renderDay(id){
  const day = byId[id]; const sec = day.sec;
  const list = days.filter(d=>d.sec===sec); const idx = list.indexOf(day);

  const counter={n:0};
  const must = day.stops.filter(s=>!s.move && s.type==='must').map(s=>strip(s.name).replace(/^[^\wא-ת]+/,''));
  const first = day.stops.find(s=>/^\d/.test(s.t));
  pane.style.setProperty('--c',day.color);
  pane.innerHTML = `
   <div class="dayhead" style="--c:${day.color}">
     <div class="date">${day.date}<span class="status ${day.status}">${statusTxt[day.status]||''}</span></div>

     <div class="about">${day.about}</div>
     <div class="meta">
       <span>⏰ יוצאים: <b>${first?first.t:'—'}</b></span>

       <span>🚶 הליכה: <b>${day.walk||'—'}</b></span>
       <span>🛏️ לינה: <b>${day.base?day.base.name:'—'}</b></span>
     </div>
     <div class="meta"><span>⭐ ליבה: <b>${must.join(' · ')||'—'}</b></span></div>
   </div>
   ${day.intro||(day.tips&&day.tips.length)?`<div class="daybox" style="--c:${day.color}">${day.intro?`<h4>📖 על היום</h4><div>${day.intro}</div>`:''}${day.tips&&day.tips.length?`<h4 style="margin-top:10px">💡 דגשים ליום</h4><ul>${day.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`:''}
   ${legend()}
   <div class="tl" style="--c:${day.color}">${day.stops.map((s,i)=>stepHtml(day,s,i,counter)).join('')}</div>
   ${day.eve?`<div class="eve-box"><h4>🌙 ערב, מ-${day.eve.t}: בוחרים אחד</h4>${day.eve.opts.map((o,j)=>`<div class="step" data-i="${day.id}_e${j}"><span class="t">${day.eve.t}</span><span class="n">${'אבגדה'[j]}</span><span>${o.isNew?'<span class="tag new">רעיון שלי</span>':''}${o.book?'<span class="tag todo">📌 עוד להזמין</span>':''}${o.name}${o.info?`<span class="info">📖 ${o.info}</span>`:''}${o.tip?`<span class="tip">💡 ${o.tip}</span>`:''}${o.d?`<span class="d">${o.d}</span>`:''}</span></div>`).join('')}</div>`:''}
   ${day.note?`<div class="note">${day.note}</div>`:''}
   ${decHtml(day)}
   <div class="links"><a href="${gmaps(day,true)}" target="_blank">🗺️ הליבה בגוגל מפות</a><a href="${gmaps(day,false)}" target="_blank">🗺️ המסלול המלא</a></div>
   <div class="nav">
     ${prev?`<button class="navbtn" onclick="go('${prev.sec}','${prev.id}')">→ ${prev.date}</button>`:'<span></span>'}
     ${next?`<button class="navbtn" onclick="go('${next.sec}','${next.id}')">${next.date} ←</button>`:'<span></span>'}
   </div>`;
  pane.querySelectorAll('.step[data-i]').forEach(el=>el.onclick=()=>{ const k=el.dataset.i; if(!markers[k]) return; if(!mapOn) toggleMap(true); const m=markers[k]; map.setView(m.getLatLng(),15); m.openPopup(); });
  drawDays([day],true);
}
function dayRow(d){
  const first = d.stops.find(s=>/^\d/.test(s.t));
  const done = d.stops.filter(s=>s.book&&s.bk!=='todo').map(s=>'✅ '+strip(s.name));
  const todo = d.stops.filter(s=>s.bk==='todo').map(s=>`<span style="color:#ff8f8f;font-weight:700">📌 ${strip(s.name)}</span>`);
  const bk = [...todo, ...done].join('<br>');
  return `<tr class="click" onclick="go('${d.sec}','${d.id}')"><td><b>${d.date}</b><br><span class="status ${d.status}" style="margin:0">${statusTxt[d.status]||''}</span></td><td>${d.theme}</td><td>${first?first.t:'—'}</td><td>${d.base?d.base.name:''}</td><td>${bk||'—'}</td></tr>`;
}
const TH = '<tr><th>יום</th><th>על מה</th><th>יוצאים</th><th>לינה</th><th>הזמנות</th></tr>';
function renderSection(sid){
  const s = sections.find(x=>x.id===sid); const list = days.filter(d=>d.sec===sid);
  pane.innerHTML = `<h2 style="color:${s.color}">${s.name} · ${s.range}</h2>
   <div class="card">${s.blurb}</div>
   <table>${TH}${list.map(dayRow).join('')}</table>
   <p style="color:var(--muted);font-size:.85rem">לחיצה על שורה פותחת את היום. המפה מראה את כל הקטע.</p>`;
  drawDays(list,false);
}

// ---------- map on/off (remembered; phones start without the map) ----------
const phone = matchMedia('(max-width:900px)');
let mapOn = localStorage.getItem('jp_map')!==null ? localStorage.getItem('jp_map')==='1' : !phone.matches;
function applyMap(){ document.body.classList.toggle('nomap',!mapOn); document.getElementById('mapbtn').textContent = mapOn?'✕ הסתר מפה':'🗺️ הצג מפה'; }
function toggleMap(on){ mapOn = on===undefined ? !mapOn : on; localStorage.setItem('jp_map',mapOn?'1':'0'); applyMap();
  const y=window.scrollY, py=pane.scrollTop; route(); window.scrollTo(0,y); pane.scrollTop=py; }
applyMap();
// ---------- navigation ----------
const secsEl = document.getElementById('secs'), chipsEl = document.getElementById('chips');
TABS.forEach(t=>{ const b=document.createElement('button'); b.dataset.id=t.id; b.style.setProperty('--sc',t.color);
  b.innerHTML=`${t.name}<small>${t.range}</small>`; b.onclick=()=>go(t.id); secsEl.appendChild(b); });
function go(sec, dayId){ location.hash = dayId ? `${sec}/${dayId}` : sec; }
function route(){
  let [sec, dayId, mode] = location.hash.slice(1).split('/');
  document.body.classList.toggle('maponly', mode==='map');
  if(!TABS.find(t=>t.id===sec)) sec='overview';
  secsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===sec));
  const list = days.filter(d=>d.sec===sec);
  chipsEl.innerHTML = list.length ? `<button data-id="" class="${dayId?'':'active'}" style="--cc:${secColor[sec]}" onclick="go('${sec}')">📋 כל הקטע</button>` + list.map(d=>{
      const nq=d.stops.filter(s=>s.bk==='todo').length;
      return `<button class="${d.id===dayId?'active':''}" style="--cc:${d.color}" onclick="go('${sec}','${d.id}')"><span class="dot" style="background:${d.color}"></span>${d.date}${nq?`<span class="qn todo">📌${nq}</span>`:''}</button>`;}).join('')
    : `<span style="color:var(--muted);font-size:.85rem;padding-top:4px">${sec==='overview'?'בחרו קטע למעלה, ואז יום. או לחצו על יום בטבלה.':''}</span>`;
  pane.scrollTop=0; window.scrollTo(0,0);
  const ac=chipsEl.querySelector('.active'); if(ac) ac.scrollIntoView({inline:'center',block:'nearest'});
  if(sec==='overview') renderOverview();
  else if(dayId && byId[dayId]) renderDay(dayId);
  else renderSection(sec);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  const [sec,dayId]=location.hash.slice(1).split('/'); if(!dayId) return;
  const i=days.findIndex(d=>d.id===dayId);
  const t = e.key==='ArrowLeft'?days[i+1]:e.key==='ArrowRight'?days[i-1]:null;
  if(t) go(t.sec,t.id);
});
route();
</script>
